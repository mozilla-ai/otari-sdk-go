      - key_prefix
      - metadata
      - reject_user_mismatch
      - user_id
      title: CreateKeyResponse
    CreateOwnKeyRequest:
      description: |-
        Create-key body for the member surface.

        Deliberately not ``CreateKeyRequest``: it carries no ``user_id`` (the owner
        is always the caller) and no ``exclude_from_budget`` (a member must not
        exempt their own spend from enforcement).
      example:
        key_name: key_name
        workspace_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        metadata:
          key: ""
        expires_at: 2000-01-23T04:56:07.000+00:00
        capture_agent_telemetry: true
        reject_user_mismatch: true
        allowed_models:
        - allowed_models
        - allowed_models
      properties:
        allowed_models:
          description: "Model allow-list: null = any model your user default allows,\
            \ [] = deny all, or canonical instance:model entries. A key can only narrow\
            \ your own model access, never broaden it."
          items:
            type: string
          nullable: true
          type: array
        capture_agent_telemetry:
          description: "Per-key override of the deployment-wide capture_agent_telemetry\
            \ setting: null (default) inherits it, true always stores this key's coding-agent\
            \ telemetry, false always discards it."
          nullable: true
          type: boolean
        expires_at:
          description: Optional expiration timestamp
          format: date-time
          nullable: true
          type: string
        key_name:
          description: Optional name for the key
          nullable: true
          type: string
        metadata:
          additionalProperties: true
          description: Optional metadata
          title: Metadata
          type: object
        reject_user_mismatch:
          description: "Per-key override of the deployment-wide reject_user_mismatch\
            \ setting: null (default) inherits it, true always rejects a request naming\
            \ a different 'user', false always accepts it. Spend binds to your own\
            \ user either way."
          nullable: true
          type: boolean
        workspace_id:
          description: "Workspace this key belongs to, which must be one you may see\
            \ in your active organization. Omitted means that organization's default\
            \ workspace, refused when you are not a member of it."
          format: uuid
          nullable: true
          type: string
      title: CreateOwnKeyRequest
    CreateScopedBudgetRequest:
      description: Request model for creating a scoped budget.
      example:
        scope_id: scope_id
        budget_id: budget_id
        name: name
        provider_key_id: provider_key_id
        scope_type: organization
      properties:
        budget_id:
          description: The budget this ceiling enforces; its limit and period are
            read through it
          maxLength: 255
          minLength: 1
          title: Budget Id
          type: string
        name:
          description: Admin-facing label for this ceiling
          maxLength: 200
          nullable: true
          type: string
        provider_key_id:
          description: "Narrow the cap to one provider instance; omit or null to cap\
            \ spend across every provider. A blank value would store a ceiling that\
            \ never binds, so it is refused; this does not check that the value names\
            \ a configured provider instance"
          maxLength: 255
          minLength: 1
          nullable: true
          pattern: ^\S+$
          type: string
        scope_id:
          description: "Id of the capped identity: an organization, workspace, membership\
            \ row, or API key"
          maxLength: 255
          minLength: 1
          title: Scope Id
          type: string
        scope_type:
          description: Which kind of identity this ceiling caps
          enum:
          - organization
          - workspace
          - workspace_member
          - org_member
          - api_token
          title: Scope Type
          type: string
      required:
      - budget_id
      - scope_id
      - scope_type
      title: CreateScopedBudgetRequest
    CreateSearchToolRequest:
