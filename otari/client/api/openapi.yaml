        explode: true
        in: query
        name: endpoint
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      - description: Filter to a single provider (e.g. 'openai')
        explode: true
        in: query
        name: provider
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      - description: Filter to a single provenance source (e.g. 'gateway' or 'claude_code')
