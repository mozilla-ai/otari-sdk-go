      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Search Providers
      tags:
      - search-tools
  /v1/search-tools/reencrypt:
    post:
      description: |-
        Re-encrypt stored search-tool keys with the primary OTARI_SECRET_KEY.

        The search-tool half of the ``OTARI_SECRET_KEY`` rotation procedure; run it
        alongside ``POST /v1/provider-credentials/reencrypt``. Rows that cannot be
        decrypted are left untouched and must be recovered by replacing the affected
        tool's key.
      operationId: reencrypt_stored_search_tool_keys_v1_search_tools_reencrypt_post
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReencryptSearchToolsResponse"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Reencrypt Stored Search Tool Keys
      tags:
      - search-tools
  /v1/search-tools/{name}:
    delete:
      description: Delete a stored search tool. A config-file search tool cannot be
        deleted here.
      operationId: delete_stored_search_tool_v1_search_tools__name__delete
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
        style: simple
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Stored Search Tool
      tags:
      - search-tools
    patch:
      description: |-
        Update a stored search tool. Omitted fields are left as-is; an explicit ``null`` clears them.

        ``api_key`` follows the same rule: omit it to keep the stored key, send a new
        one to rotate, or send ``null`` to clear it (a keyless SearXNG backend). The
        row is locked ``FOR UPDATE`` so the ``expected_updated_at`` check and the
        write it guards are atomic. The tool as it will be after the update is
        validated, so a change that would leave it unusable (clearing the key of a
        provider that needs one) is refused rather than stored.
      operationId: update_search_tool_v1_search_tools__name__patch
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSearchToolRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoredSearchToolSchema"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Update Search Tool
      tags:
      - search-tools
  /v1/search/{search_tool_name}:
    post:
      description: |-
        Run a search against the search tool named in the path.

        Identical to ``POST /v1/search`` except that the path names the tool, which
        is the form LiteLLM clients use. Any ``search_tool_name`` in the body is
        ignored.

        Authentication modes:
        - Master key: the ``user`` field is required and may name any existing user.
        - API key: usage and spend always bind to the key's own user. A ``user``
          field naming a different user is rejected with 403 (or ignored, when the
          key's own ``reject_user_mismatch`` is false, or the deployment-wide
          setting is disabled and the key does not override it); it is never billed
          to that user.
      operationId: create_search_for_tool_v1_search__search_tool_name__post
      parameters:
      - description: Configured search tool to run against
        explode: false
        in: path
        name: search_tool_name
        required: true
        schema:
          description: Configured search tool to run against
          title: Search Tool Name
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Search For Tool
      tags:
      - search
