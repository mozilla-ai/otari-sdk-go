    MR_BetaFallbackBlock:
      additionalProperties: true
      description: |-
        Marks the point in `content` where one model's output gives way to the next.

        One block appears per hop where a preceding model actually ran this turn and
        declined. A turn where no preceding model ran and declined has no such
        boundary and carries no block — the signal for whether a fallback model
        served the response is the presence of a `fallback_message` entry in
        `usage.iterations`, not this block.

        The block is treated like a server-tool content block for streaming: it
        arrives via the standard `content_block_start` / `content_block_stop`
        pair and carries no deltas.
      properties:
        from:
          $ref: "#/components/schemas/MR_BetaFallbackInfo"
        to:
          $ref: "#/components/schemas/MR_BetaFallbackInfo"
        trigger:
          $ref: "#/components/schemas/MR_BetaFallbackRefusalTrigger"
        type:
          enum:
          - fallback
          title: Type
          type: string
      required:
      - from
      - to
      - trigger
      - type
      title: BetaFallbackBlock
    MR_BetaFallbackInfo:
      additionalProperties: true
      description: Identifies one hop of a fallback transition.
      properties:
        model:
          $ref: "#/components/schemas/Model_1"
      required:
      - model
      title: BetaFallbackInfo
    MR_BetaFallbackMessageIterationUsage:
      additionalProperties: true
      description: |-
        Token usage for the fallback-model attempt of a server-side fallback request.

        Produced in place of a `message` entry for whichever hop served the
        response. A declined hop produces the existing `message` entry. Whether
        a fallback model served the response is signalled by the presence of this
        entry in `usage.iterations`.
      properties:
        cache_creation:
          allOf:
          - $ref: "#/components/schemas/MR_BetaCacheCreation"
          nullable: true
        cache_creation_input_tokens:
          title: Cache Creation Input Tokens
          type: integer
        cache_read_input_tokens:
          title: Cache Read Input Tokens
          type: integer
        input_tokens:
          title: Input Tokens
          type: integer
        model:
          $ref: "#/components/schemas/Model_1"
        output_tokens:
          title: Output Tokens
          type: integer
        type:
          enum:
          - fallback_message
          title: Type
          type: string
      required:
      - cache_creation_input_tokens
      - cache_read_input_tokens
      - input_tokens
      - model
      - output_tokens
      - type
      title: BetaFallbackMessageIterationUsage
