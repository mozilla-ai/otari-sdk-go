  /v1/batches/{batch_id}/results:
    get:
      description: Retrieve the results of a completed batch.
      operationId: retrieve_batch_results_v1_batches__batch_id__results_get
      parameters:
      - explode: false
        in: path
        name: batch_id
        required: true
        schema:
          title: Batch Id
          type: string
        style: simple
      - explode: true
        in: query
        name: provider
        required: true
        schema:
          title: Provider
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "409":
          description: Batch is not yet complete
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
        "502":
          description: LLM provider error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Retrieve Batch Results
      tags:
      - batches
