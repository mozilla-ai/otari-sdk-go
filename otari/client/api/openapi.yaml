    PasskeySessionResponse:
      description: |-
        A dashboard session minted by a passkey (the token travels only in the cookie).

        The same three fields ``POST /v1/auth/session`` answers, deliberately: the
        dashboard's sign-in path does not care which credential got it here.
      example:
        active_organization_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        expires_at: 2000-01-23T04:56:07.000+00:00
        user_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        active_organization_id:
          description: "The organization that identity is acting in, which scopes\
            \ every tenancy surface."
          format: uuid
          title: Active Organization Id
          type: string
        expires_at:
          description: When the session cookie stops being accepted.
          format: date-time
          title: Expires At
          type: string
        user_id:
          description: The identity this session speaks for.
          format: uuid
          title: User Id
          type: string
      required:
      - active_organization_id
      - expires_at
      - user_id
      title: PasskeySessionResponse
    PasswordResponse:
      description: What the identity signs in with now.
      example:
        master_key_sign_in_retired: true
        email: email
      properties:
        email:
          description: The address this identity signs in with.
          title: Email
          type: string
        master_key_sign_in_retired:
          description: "Whether POST /v1/auth/session has stopped accepting the master\
            \ key as a dashboard login. True once the operator identity has a password,\
            \ which is what claiming the deployment means; a member setting their\
            \ own password leaves an unclaimed deployment on the master key. Either\
            \ way the master key stays the credential for the management API."
          title: Master Key Sign In Retired
          type: boolean
      required:
      - email
      - master_key_sign_in_retired
      title: PasswordResponse
    PendingOrganizationInvitationPublic:
      description: |-
        One invitation waiting on the caller, as their own inbox lists it.

        The authenticated counterpart to ``InvitationPreviewPublic``, and wider
        than it on purpose: that one answers a visitor whose only credential is
        the token, so it carries nothing it does not strictly need, while this one
        answers the addressee's own session and can name the ids its accept and
        decline calls take.

        ``organization_member_id`` is what those two calls address, not
        ``invitation_id``: the membership is the row that outlives a revoke and a
        re-invite (each round mints a fresh ``Invitation`` against the same
        membership), so a client holding a list from a moment ago names something
        still resolvable rather than a token-shaped id that has since been
        superseded. ``invitation_id`` rides along for the roster's sake, since
        ``ActiveOrganizationMemberPublic`` carries the same field.
      example:
        invitation_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        expires_at: 2000-01-23T04:56:07.000+00:00
        role: role
        organization_member_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        organization_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        created_at: 2000-01-23T04:56:07.000+00:00
        organization_name: organization_name
        email: email
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          title: Email
          type: string
        expires_at:
          format: date-time
          title: Expires At
          type: string
        invitation_id:
          format: uuid
          title: Invitation Id
          type: string
        organization_id:
          format: uuid
          title: Organization Id
          type: string
        organization_member_id:
          format: uuid
          title: Organization Member Id
          type: string
        organization_name:
          title: Organization Name
          type: string
        role:
          title: Role
          type: string
      required:
      - created_at
      - email
      - expires_at
      - invitation_id
      - organization_id
      - organization_member_id
      - organization_name
      - role
      title: PendingOrganizationInvitationPublic
    PendingOrganizationInvitationsPublic:
