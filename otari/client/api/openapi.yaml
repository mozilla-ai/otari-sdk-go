    OrganizationModelPricingUpdate:
      description: |-
        Replace an override's rates and period.

        ``effective_from`` is required here, where a create defaults it to now. A
        replacement states the whole row, so defaulting an omitted start would move a
        stored period to the present: an operator editing next quarter's rate through
        a client that does not send the field would silently bring it into effect
        today, or collide with the period that currently applies. Stating it is the
        only reading that cannot surprise.

        A full replacement rather than a patch: every rate field is present in the
        body and an omitted optional rate is cleared, so the stored row is exactly
        what was sent. That is the opposite of ``POST /v1/pricing``, which inherits an
        omitted cache rate from the model's previous version, and deliberately so:
        that surface versions a catalog where each write adds a row, while this one
        edits a single row in place and an inheriting patch would make the result
        depend on what happened to be stored before.

        ``model_key`` is absent because it is immutable. Repointing an override at
        another model is retiring one and creating another, which is two requests.
      example:
        input_price_per_million: 0.5962133916683182
        effective_to: 2000-01-23T04:56:07.000+00:00
        cache_write_1h_price_per_million: 0.6027456183070403
        effective_from: 2000-01-23T04:56:07.000+00:00
        output_price_per_million: 0.5637376656633328
        cache_read_price_per_million: 0.08008281904610115
        cache_write_price_per_million: 0.14658129805029452
        pricing_tiers:
        - min_input_tokens: 0
          input_price_per_million: 0.20271230230023218
          cache_write_1h_price_per_million: 0.9301444243932576
          output_price_per_million: 0.7386281948385884
          cache_read_price_per_million: 0.7061401241503109
          cache_write_price_per_million: 0.3616076749251911
        - min_input_tokens: 0
          input_price_per_million: 0.20271230230023218
          cache_write_1h_price_per_million: 0.9301444243932576
          output_price_per_million: 0.7386281948385884
          cache_read_price_per_million: 0.7061401241503109
          cache_write_price_per_million: 0.3616076749251911
      properties:
        cache_read_price_per_million:
          description: Price per 1M cached-input tokens
          minimum: 0.0
          nullable: true
          type: number
        cache_write_1h_price_per_million:
          description: Price per 1M Anthropic 1-hour cache-write tokens
          minimum: 0.0
          nullable: true
          type: number
        cache_write_price_per_million:
          description: Price per 1M cache-write (creation) tokens
          minimum: 0.0
          nullable: true
          type: number
        effective_from:
          description: "ISO 8601 datetime from which this rate applies, inclusive.\
            \ Required on a replacement, so an omitted value cannot silently move\
            \ a stored period to the present."
          format: date-time
          title: Effective From
          type: string
        effective_to:
          description: "ISO 8601 datetime at which this rate stops applying, exclusive.\
            \ Null leaves it open ended. Because the end is exclusive, the next period\
            \ may begin at exactly this instant without overlapping."
          format: date-time
          nullable: true
          type: string
        input_price_per_million:
          description: Price per 1M input tokens
          minimum: 0.0
          title: Input Price Per Million
          type: number
        output_price_per_million:
          description: Price per 1M output tokens
          minimum: 0.0
          title: Output Price Per Million
          type: number
        pricing_tiers:
          description: Whole-request context thresholds. Fields omitted by a tier
            inherit the base rate.
          items:
            $ref: "#/components/schemas/PricingTier"
          nullable: true
          type: array
      required:
      - effective_from
      - input_price_per_million
      - output_price_per_million
      title: OrganizationModelPricingUpdate
