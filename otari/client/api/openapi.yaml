          title: Input
          type: string
        instructions:
          nullable: true
          type: string
        model:
          title: Model
          type: string
        response_format:
          nullable: true
          type: string
        speed:
          nullable: true
          type: number
        user:
          nullable: true
          type: string
        voice:
          title: Voice
          type: string
      required:
