        mode:
          default: monitor
          enum:
          - block
          - monitor
          title: Mode
          type: string
        "on":
          items:
            enum:
            - input
            - output
            type: string
          title: "On"
          type: array
        on_unavailable:
          default: block
          enum:
          - block
          - monitor
          title: On Unavailable
          type: string
        profile:
          maxLength: 128
          minLength: 1
          title: Profile
          type: string
        url:
          minLength: 1
          nullable: true
          type: string
        validate_kwargs:
          additionalProperties: true
          title: Validate Kwargs
          type: object
      required:
