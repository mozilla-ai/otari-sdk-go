  /v1/web-search/search:
    get:
      description: |-
        Run one search through this deployment's configured search provider.

        The declared query params are the ``provider_options`` keys the providers
        understand. Everything else the caller sends, ``format`` and ``engines``
        included, is ignored rather than forwarded: the bag is opaque to the gateway
        that filled it, so passing it upstream unread would let a workspace set
        provider request fields this deployment never chose.
      operationId: web_search_v1_web_search_search_get
      parameters:
      - description: The search query.
        explode: true
        in: query
        name: q
        required: true
        schema:
          description: The search query.
          minLength: 1
          title: Q
          type: string
        style: form
      - explode: true
        in: query
        name: max_results
        required: false
        schema:
          maximum: 20
          minimum: 1
          nullable: true
          type: integer
        style: form
      - explode: true
        in: query
        name: search_depth
        required: false
        schema:
          nullable: true
          pattern: ^(basic|advanced)$
          type: string
        style: form
      - explode: true
        in: query
        name: topic
        required: false
        schema:
          nullable: true
          pattern: ^(general|news|finance)$
          type: string
        style: form
      - explode: true
        in: query
        name: time_range
        required: false
        schema:
          nullable: true
          pattern: ^(day|week|month|year|d|w|m|y)$
          type: string
        style: form
      - explode: true
        in: query
        name: include_answer
        required: false
        schema:
          description: "Filter by token-pricing state: true = only rows whose model\
            \ tokens were priced, false = only rows that still need pricing (no cost\
            \ at all, or tokens that were never metered because the model had no rate).\
            \ A row charged only for gateway-run tool calls still counts as needing\
            \ pricing."
          nullable: true
          type: boolean
        style: form
      - explode: false
        in: header
        name: x-gateway-token
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebSearchBackendResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - GatewayTokenAuth: []
      summary: Web Search
      tags:
      - web-search
