    PolicyRequest:
      description: Request to create or update a routing policy.
      example:
        workspace_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        user_id: user_id
        name: name
        rename_from: rename_from
        spec:
          key: ""
      properties:
        name:
          description: "Model name callers send, e.g. 'fast'."
          title: Name
          type: string
        rename_from:
          description: "Current name of the policy to rename, in the same scope, meaning\
            \ the same workspace and the same user. A rename never moves a policy\
            \ between them. The stored row keeps its id and created_at and takes `name`\
            \ and `spec`. Sending it asserts that policy exists, so a name with no\
            \ stored row is a 404 rather than a create, even when it equals `name`.\
            \ Omit to create or update the policy named `name`. Renaming changes what\
            \ callers must send as `model`; usage already recorded keeps the old name."
          nullable: true
          type: string
        spec:
          additionalProperties: true
          description: "The policy body: select (with exactly one `default` entry,\
            \ last), optional on_failure and guardrails. Same schema as a `routing.policies`\
            \ entry in config.yml, and closed to unknown keys, so a typo is a 400\
            \ rather than a silently ignored setting."
          title: Spec
          type: object
        user_id:
          description: User this policy belongs to. Omit for a policy every caller
            in the workspace sees. A user-scoped policy resolves only for that user
            and shadows the workspace-wide one of the same name.
          nullable: true
          type: string
        workspace_id:
          description: "Workspace this policy belongs to. Omit for the deployment's\
            \ default workspace. The policy resolves only for requests in that workspace,\
            \ so two workspaces can each define their own 'fast'."
          format: uuid
          nullable: true
          type: string
      required:
      - name
      - spec
      title: PolicyRequest
    PolicyResponse:
      description: A routing policy and where it is defined.
      example:
        workspace_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
