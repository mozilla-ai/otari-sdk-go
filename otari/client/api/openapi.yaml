      tags:
      - otel
  /v1/usage:
    delete:
      description: |-
        Delete imported usage rows by explicit ids or by filter (standalone).

        Target either the current selection (``ids``) or everything matching a filter
        (``by_filter: true`` plus optional ``source`` / ``model`` / ``user_id`` /
        ``status`` / date range / ``priced``). Only imported rows
        (``counts_toward_budget = false``) are ever removed: enforced gateway rows and
        the spend ledger (``users.spend``) are untouched, so a delete can never desync a
        budget. Master-key only.
      operationId: delete_usage_rows_v1_usage_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageDeleteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageDeleteResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Usage Rows
      tags:
      - usage
    get:
      description: |-
        List usage logs ordered by timestamp (most recent first).

        Supports optional filters for time range, user, status, failure status code,
        model, endpoint, provider, source, session (``source_label``), and request
        group (``request_group_id``, repeatable, which returns a routed request's
        whole attempt plan). Paginated via skip/limit. The return shape is a bare JSON array; external
        billing/analytics consumers depend on this, so the total row count for a
        paginated UI is served separately by ``GET /v1/usage/count`` rather than
        wrapped in an envelope here. Timestamps accept either ISO 8601 strings or
        Unix epoch seconds (numeric).
      operationId: list_usage_v1_usage_get
      parameters:
      - description: Return logs with timestamp >= start_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Return logs with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return logs with timestamp < end_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: Return logs with timestamp < end_date (ISO 8601 or Unix epoch
            seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Filter to one or more users; repeatable (user_id=a&user_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Filter to one or more users; repeatable (user_id=a&user_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter to a single status: 'success', 'error', or 'absorbed'\
          \ (an attempt a routing policy recovered from, excluded from error_count\
          \ and request_count)"
        explode: true
        in: query
        name: status
        required: false
        schema:
          description: "Filter to a single status: 'success', 'error', or 'absorbed'\
            \ (an attempt a routing policy recovered from, excluded from error_count\
            \ and request_count)"
          nullable: true
          type: string
        style: form
      - description: "Filter to a single failure status code (e.g. 429 for provider\
          \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
          \ one, so this filter also restricts to status='error' unless 'status' is\
          \ given explicitly"
        explode: true
        in: query
        name: status_code
        required: false
        schema:
          description: "Filter to a single failure status code (e.g. 429 for provider\
            \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
            \ one, so this filter also restricts to status='error' unless 'status'\
            \ is given explicitly"
          nullable: true
          type: integer
        style: form
      - description: Filter to one or more models; repeatable (model=a&model=b). Several
          values match any of them. At most 50 per call.
        explode: true
        in: query
        name: model
        required: false
        schema:
          description: Filter to one or more models; repeatable (model=a&model=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: Filter to a single endpoint (e.g. '/v1/chat/completions')
        explode: true
        in: query
        name: endpoint
        required: false
        schema:
          description: Filter to a single endpoint (e.g. '/v1/chat/completions')
          nullable: true
          type: string
        style: form
      - description: Filter to a single provider (e.g. 'openai')
        explode: true
        in: query
        name: provider
        required: false
        schema:
          description: Filter to a single provider (e.g. 'openai')
          nullable: true
          type: string
        style: form
      - description: Filter to a single provenance source (e.g. 'gateway' or 'claude_code')
        explode: true
        in: query
        name: source
        required: false
        schema:
          description: Filter to a single provenance source (e.g. 'gateway' or 'claude_code')
          nullable: true
          type: string
        style: form
      - description: Filter to a single session/project label (the source_label carried
          by imported usage)
        explode: true
        in: query
        name: source_label
        required: false
        schema:
          description: Filter to a single session/project label (the source_label
            carried by imported usage)
          nullable: true
          type: string
        style: form
      - description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: api_key_id
        required: false
        schema:
          description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter by token-pricing state: true = only rows whose model\
          \ tokens were priced, false = only rows that still need pricing (no cost\
          \ at all, or tokens that were never metered because the model had no rate).\
          \ A row charged only for gateway-run tool calls still counts as needing\
          \ pricing."
        explode: true
        in: query
        name: priced
        required: false
        schema:
          description: "Filter by token-pricing state: true = only rows whose model\
            \ tokens were priced, false = only rows that still need pricing (no cost\
            \ at all, or tokens that were never metered because the model had no rate).\
            \ A row charged only for gateway-run tool calls still counts as needing\
            \ pricing."
          nullable: true
          type: boolean
        style: form
      - description: "Filter to requests that ran a gateway-run tool. 'any' matches\
          \ any tool; a tool name (web_search, code_execution) matches that tool specifically."
        explode: true
        in: query
        name: tool
        required: false
        schema:
          description: "Filter to requests that ran a gateway-run tool. 'any' matches\
            \ any tool; a tool name (web_search, code_execution) matches that tool\
            \ specifically."
          enum:
          - any
          - web_search
          - code_execution
          nullable: true
          type: string
        style: form
      - description: "Filter by budget participation, which is not the same question\
          \ as provenance: true = only enforced gateway rows, false = every row that\
          \ never touches a budget, meaning imported usage and also gateway traffic\
          \ on a budget-exempt key"
        explode: true
        in: query
        name: counts_toward_budget
        required: false
        schema:
          description: "Filter by budget participation, which is not the same question\
            \ as provenance: true = only enforced gateway rows, false = every row\
            \ that never touches a budget, meaning imported usage and also gateway\
            \ traffic on a budget-exempt key"
          nullable: true
          type: boolean
        style: form
      - description: "Filter to the rows of one or more request groups; repeatable\
          \ (request_group_id=a&request_group_id=b). A routed request writes one row\
          \ per attempt, all sharing a request_group_id, so this returns a request's\
          \ whole plan: its absorbed attempts and the attempt that served it. Ignore\
          \ ordering by timestamp and read attempt_position to reconstruct the plan.\
          \ At most 1000 ids per call."
        explode: true
        in: query
        name: request_group_id
        required: false
        schema:
          description: "Filter to the rows of one or more request groups; repeatable\
            \ (request_group_id=a&request_group_id=b). A routed request writes one\
            \ row per attempt, all sharing a request_group_id, so this returns a request's\
            \ whole plan: its absorbed attempts and the attempt that served it. Ignore\
            \ ordering by timestamp and read attempt_position to reconstruct the plan.\
            \ At most 1000 ids per call."
          items:
            type: string
          maxItems: 1000
          nullable: true
          type: array
        style: form
      - description: Only usage recorded in this workspace.
        explode: true
        in: query
        name: workspace_id
        required: false
        schema:
          description: Only usage recorded in this workspace.
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UsageEntry"
                title: Response List Usage V1 Usage Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Usage
      tags:
      - usage
  /v1/usage/count:
    get:
      description: |-
        Total number of usage logs matching the given filters.

        Serves the dashboard paginator's "N of M" total without changing the bare
        array contract of ``GET /v1/usage``. Runs only when the client asks (a
        separate request), so the ``COUNT(*)`` is not paid on every page load. With
        ``counts_toward_budget=false`` it also backs the "select all N matching this
        filter" affordance for bulk delete / set-price, which touch imported rows only.

        That value is the one place this count is narrower than ``GET /v1/usage``: it
        also excludes rows this deployment served itself, so the number an operator
        confirms is the number the mutation can reach. The list still pages the
        budget-exempt gateway rows it omits.
      operationId: count_usage_v1_usage_count_get
      parameters:
      - description: Return logs with timestamp >= start_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Return logs with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return logs with timestamp < end_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: Return logs with timestamp < end_date (ISO 8601 or Unix epoch
            seconds)
          format: date-time
