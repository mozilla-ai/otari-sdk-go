            \ At most 1000 ids per call."
          items:
            type: string
          maxItems: 1000
          nullable: true
          type: array
        style: form
      - description: Only usage recorded in this workspace.
        explode: true
        in: query
        name: workspace_id
        required: false
        schema:
          description: Delete the alias in this workspace. Omit for the deployment's
            default workspace.
          format: uuid
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: skip
        required: false
        schema:
          default: 0
          minimum: 0
          title: Skip
          type: integer
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/UsageEntry"
                title: Response List Organization Usage V1 Organizations Me Usage
                  Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Organization Usage
      tags:
      - organization-usage
