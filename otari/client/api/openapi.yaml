      - bucket
      - end_date
      - group_by
      - groups
      - points
      - start_date
      title: UsageGroupedSeries
    UsageGroupedSeriesPoint:
      description: |-
        One (time bucket, group) cell of a grouped series.

        ``key``/``is_other`` follow the ``UsageGroupRow`` convention: ``key=None``
        with ``is_other=True`` is the fold of groups outside the top N, ``key=None``
        with ``is_other=False`` is a real NULL group (e.g. a deleted user).
        ``tokens`` is the *billed* total (input including cache, plus output), the
        same quantity the ungrouped series' composition fields sum to.
      example:
        cost: 5.962133916683182
        bucket_start: bucket_start
        tokens: 2
        requests: 5
        is_other: false
        key: key
      properties:
        bucket_start:
          title: Bucket Start
          type: string
        cost:
          title: Cost
          type: number
        is_other:
          default: false
          title: Is Other
          type: boolean
        key:
          nullable: true
          type: string
        requests:
          title: Requests
          type: integer
        tokens:
          title: Tokens
          type: integer
      required:
      - bucket_start
      - cost
      - key
      - requests
      - tokens
      title: UsageGroupedSeriesPoint
