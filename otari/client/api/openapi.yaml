        name: name
        created_at: created_at
        has_token: true
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        enabled: true
        url: url
        purpose_hint: purpose_hint
      properties:
        allowed_tools:
          items:
            type: string
          nullable: true
          type: array
        created_at:
          title: Created At
          type: string
        enabled:
          title: Enabled
          type: boolean
        has_token:
          title: Has Token
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        name:
          title: Name
