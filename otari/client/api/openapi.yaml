      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Update Maintenance Mode
      tags:
      - settings
  /v1/settings/master-key/rotate:
    post:
      description: |-
        Regenerate the database-backed master key and invalidate the old one.

        Only the first-run generated master key can be rotated here. When a master
        key is supplied through config or ``OTARI_MASTER_KEY``, the dashboard cannot
        invalidate it; the operator must change that value and restart instead.

        Every dashboard session is revoked with the rotation (a session only proves
        possession of the now-dead key); the caller's own session is re-minted under
        the new key, for the same identity it named, so the tab that performed the
        rotation stays signed in as who it was. A caller that authenticated with a
        header key has no session identity to re-mint for, so it is not handed one:
        it was not signed in to the dashboard to begin with.
      operationId: rotate_master_key_v1_settings_master_key_rotate_post
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateMasterKeyResponse"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Rotate Master Key
      tags:
      - settings
  /v1/tool-settings:
    get:
      description: |-
        Return the effective tool/guardrail settings for the dashboard.

        Authentication only on the router: the role decides *how much* rather than
        whether, so this is not the deployment-wide gate ``require_deployment_operator``
        names. A header master key is the deployment credential and reads everything;
        a session reads everything only while it operates the deployment, and
        otherwise gets the fields without the service endpoints in them.
      operationId: get_tool_settings_v1_tool_settings_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSettingsResponse"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Get Tool Settings
      tags:
      - tool-settings
    patch:
      description: |-
        Persist and apply tool/guardrail setting changes.

        Uses ``model_fields_set`` so an explicit ``null`` clears a field while an
        omitted field is left unchanged. Operator-gated and standalone-only.
      operationId: update_tool_settings_v1_tool_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSettingsResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Update Tool Settings
      tags:
      - tool-settings
  /v1/tool-settings/{service}/test:
    post:
      description: |-
        Structurally validate a URL and probe it for reachability.

        Tests the URL in the request body (typically unsaved), so an operator can
        verify before saving. The probe is a plain HTTP GET with a short timeout: any
        HTTP response means the host is reachable; a connection/timeout/DNS error means
        it is not. The operator is trusted (master key), so no SSRF deny-list applies;
        only the structural check (http/https + host) runs first.
      operationId: test_service_v1_tool_settings__service__test_post
      parameters:
      - explode: false
        in: path
        name: service
        required: true
        schema:
          title: Service
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestServiceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestServiceResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Test Service
      tags:
      - tool-settings
  /v1/tools:
