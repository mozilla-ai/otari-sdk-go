      - provider
      title: CreateSearchToolRequest
    CreateSessionRequest:
      description: |-
        Sign in to the dashboard with exactly one credential.

        A flat body with an optional field per credential, rather than a tagged
        union: it is one extra key on the wire, it generates a client type a
        hand-written form can fill in, and the validator below makes the two forms
        exclusive anyway.

        The example carries one credential, because a generated example is a body
        somebody will post: the schema alone would produce every field at once,
        which is the one shape the validator below refuses.
      example:
        email: operator@example.com
        password: a-real-password
      properties:
        email:
          description: The identity's sign-in address.
          maxLength: 255
          nullable: true
          type: string
        master_key:
          description: "The gateway master key; verified once and never stored by\
            \ the browser. Accepted only while the operator identity has no password,\
            \ which is to say while nobody has claimed this deployment (see GET /v1/bootstrap)."
          maxLength: 512
          nullable: true
          type: string
        password:
          description: The identity's password.
          maxLength: 72
          nullable: true
          type: string
      title: CreateSessionRequest
    CreateStoredProviderRequest:
      description: Create a stored provider. ``api_key`` is write-only and requires
        OTARI_SECRET_KEY.
      example:
        provider_type: provider_type
        instance: instance
        api_key: api_key
        api_base: api_base
        client_args:
          key: ""
      properties:
        api_base:
          nullable: true
          type: string
        api_key:
          description: Provider API key. Stored encrypted; never returned.
          nullable: true
          type: string
        client_args:
          additionalProperties: true
          description: "Provider-native request fields used as defaults (e.g. exa's\
            \ 'type', searxng's 'engines')."
          nullable: true
          type: object
        instance:
          description: "Routing key, e.g. 'openai' or a named instance like 'home_lab'."
          minLength: 1
          title: Instance
          type: string
        provider_type:
          description: any-llm implementation when the instance name is not itself
            one.
          nullable: true
          type: string
      required:
      - instance
      title: CreateStoredProviderRequest
    CreateUserRequest:
      description: Request model for creating a new user.
      example:
        metadata:
          key: ""
        blocked: false
        user_id: user_id
        budget_id: budget_id
        alias: alias
        allowed_models:
        - allowed_models
        - allowed_models
      properties:
        alias:
          description: Optional admin-facing alias
          nullable: true
          type: string
        allowed_models:
          description: "Default model access-list this user's keys inherit; null =\
            \ unrestricted, [] = deny all"
          items:
            type: string
          nullable: true
          type: array
        blocked:
          default: false
          description: Whether user is blocked
          title: Blocked
          type: boolean
        budget_id:
          description: Optional budget ID
          nullable: true
          type: string
        metadata:
          additionalProperties: true
          description: Optional metadata
          title: Metadata
