                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Rerank
      tags:
      - rerank
  /v1/responses:
    post:
      description: |-
        OpenAI-compatible Responses endpoint.

        Supports MCP tool-use loops, sandboxed code execution, and SearXNG
        web_search in both standalone mode and hybrid mode. Hybrid-mode requests
        resolve credentials via the platform service and get multi-attempt
        fallback across the resolved route, tool-loop requests included (fallback
        applies up to the pre-lock-in point, same as chat).
      operationId: create_response_v1_responses_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponsesRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Response
      tags:
      - responses
  /v1/routing/policies:
    get:
      description: |-
        List every routing policy in force, from config.yml and from storage.

        Every scope at once, global and user-scoped alike: this is the master-key
        management view, not what any one caller resolves.
      operationId: list_policies_v1_routing_policies_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/PolicyResponse"
                title: Response List Policies V1 Routing Policies Get
                type: array
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Policies
      tags:
      - routing
    post:
      description: |-
        Create or update a stored policy, global or scoped to one user.

        The spec is validated here and stored as given, so a row can never contain a
        body this build would refuse at load. The cache is refreshed twice: once before
        validating (so the shadowing checks see other writers' policies) and once after
        committing (so this worker serves the new policy immediately).
      operationId: set_policy_v1_routing_policies_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Set Policy
      tags:
      - routing
  /v1/routing/policies/explain:
    post:
      description: |-
        Compile a policy and return the plan, without dispatching anything.

        Master-key gated, and deliberately so: the response enumerates the policy's
        targets, which is exactly the information a policy exists to keep off the wire.
        It is a management surface, not a caller-facing one.

        Accepts an unsaved ``spec`` as well as a saved ``name``, so a form can validate
        what the operator is about to save. The response includes dropped candidates
        with reasons, which is the part that catches a "failover" policy that has
        quietly compiled down to a single attempt.
      operationId: explain_policy_v1_routing_policies_explain_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExplainRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExplainResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Explain Policy
      tags:
      - routing
  /v1/routing/policies/{name}:
    delete:
      description: |-
        Delete a stored policy in one scope.

        Scoped by ``user_id`` for the same reason the upsert is: deleting the global
        policy must not take a user's override with it, and deleting an override must
        leave the global one serving everyone else.
      operationId: delete_policy_v1_routing_policies__name__delete
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
        style: simple
      - description: Delete the policy scoped to this user. Omit to delete the global
          one.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Policy
      tags:
      - routing
  /v1/search:
    post:
      description: |-
        Run a search against a configured search tool.

        The tool is taken from ``search_tool_name``, which may be omitted when
        exactly one tool is configured.

        Authentication modes:
        - Master key: the ``user`` field is required and may name any existing user.
        - API key: usage and spend always bind to the key's own user. A ``user``
          field naming a different user is rejected with 403 (or ignored, when the
          key's own ``reject_user_mismatch`` is false, or the deployment-wide
          setting is disabled and the key does not override it); it is never billed
          to that user.
      operationId: create_search_v1_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Search
      tags:
      - search
  /v1/search/{search_tool_name}:
    post:
      description: |-
        Run a search against the search tool named in the path.

        Identical to ``POST /v1/search`` except that the path names the tool, which
        is the form LiteLLM clients use. Any ``search_tool_name`` in the body is
        ignored.

        Authentication modes:
        - Master key: the ``user`` field is required and may name any existing user.
        - API key: usage and spend always bind to the key's own user. A ``user``
          field naming a different user is rejected with 403 (or ignored, when the
          key's own ``reject_user_mismatch`` is false, or the deployment-wide
          setting is disabled and the key does not override it); it is never billed
          to that user.
      operationId: create_search_for_tool_v1_search__search_tool_name__post
      parameters:
      - description: Configured search tool to run against
        explode: false
        in: path
        name: search_tool_name
        required: true
        schema:
          description: Configured search tool to run against
          title: Search Tool Name
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Search For Tool
      tags:
      - search
  /v1/settings:
    get:
      description: Return non-secret runtime settings for the admin dashboard.
      operationId: get_settings_v1_settings_get
      responses:
        "200":
          content:
            application/json:
