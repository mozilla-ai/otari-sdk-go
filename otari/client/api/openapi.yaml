        exclude_from_budget:
          title: Exclude From Budget
          type: boolean
        expires_at:
          nullable: true
          type: string
        id:
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        key:
          title: Key
          type: string
        key_name:
          nullable: true
          type: string
        key_prefix:
          nullable: true
          type: string
        metadata:
          additionalProperties: true
          title: Metadata
          type: object
        reject_user_mismatch:
          nullable: true
          type: boolean
        user_id:
