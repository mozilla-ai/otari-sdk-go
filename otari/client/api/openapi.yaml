  /v1/organizations/me/usage:
    get:
      description: |-
        List the caller's organization's usage logs, most recent first.

        The tenant-scoped counterpart of ``GET /v1/usage``: same filters, same bare
        JSON array, same separate ``/count`` for a paginator's total, confined to
        what the caller's membership lets them see. Scope is never a parameter here.
      operationId: list_organization_usage_v1_organizations_me_usage_get
      parameters:
      - description: Return logs with timestamp >= start_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Return rows with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return logs with timestamp < end_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: Return rows with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Filter to one or more users; repeatable (user_id=a&user_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Filter to one or more users; repeatable (user_id=a&user_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter to a single status: 'success', 'error', or 'absorbed'\
          \ (an attempt a routing policy recovered from, excluded from error_count\
          \ and request_count)"
        explode: true
        in: query
        name: status
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      - description: "Filter to a single failure status code (e.g. 429 for provider\
          \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
          \ one, so this filter also restricts to status='error' unless 'status' is\
          \ given explicitly"
        explode: true
        in: query
        name: status_code
        required: false
        schema:
          description: "Filter to a single failure status code (e.g. 429 for provider\
            \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
            \ one, so this filter also restricts to status='error' unless 'status'\
            \ is given explicitly"
          nullable: true
          type: integer
        style: form
      - description: Filter to one or more models; repeatable (model=a&model=b). Several
          values match any of them. At most 50 per call.
        explode: true
        in: query
        name: model
        required: false
        schema:
          description: Filter to one or more models; repeatable (model=a&model=b).
            Several values match any of them. At most 50 per call.
