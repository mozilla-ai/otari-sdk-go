        request_limit: 2147483647
        budget_duration_sec: 0
        name: name
        max_budget: 6.027456183064376E11
        reset_alignment: calendar_day
      properties:
        budget_duration_sec:
          description: "Budget duration in seconds (e.g., 86400 for daily, 604800\
            \ for weekly)"
          exclusiveMinimum: true
          minimum: 0.0
          nullable: true
          type: integer
        max_budget:
          description: Maximum spending limit
          maximum: 999999999999
          minimum: 0.0
          nullable: true
          type: number
        name:
          description: Admin-facing label for the budget
          nullable: true
          type: string
        request_limit:
          description: Maximum requests over the period. Independent of max_budget;
            null is unlimited
          maximum: 1000000000000000
          minimum: 0.0
          nullable: true
          type: integer
        reset_alignment:
          description: "Reset on a UTC calendar boundary instead of a fixed number\
            \ of seconds, which is the only way to express a calendar month. Mutually\
            \ exclusive with budget_duration_sec"
          enum:
          - calendar_day
          - calendar_week
          - calendar_month
          nullable: true
          type: string
        token_limit:
          description: Maximum tokens over the period. Independent of max_budget;
            null is unlimited
          maximum: 1000000000000000
          minimum: 0.0
          nullable: true
          type: integer
      title: CreateBudgetRequest
    CreateKeyRequest:
      description: Request model for creating a new API key.
      example:
        key_name: key_name
        workspace_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        exclude_from_budget: false
        metadata:
          key: ""
        expires_at: 2000-01-23T04:56:07.000+00:00
        user_id: user_id
        capture_agent_telemetry: true
        reject_user_mismatch: true
        allowed_models:
        - allowed_models
        - allowed_models
      properties:
        allowed_models:
          description: "Model allow-list: null = any model, [] = deny all, or canonical\
            \ instance:model entries (with instance:* / instance:prefix* wildcards)."
          items:
            type: string
          nullable: true
          type: array
        capture_agent_telemetry:
          description: "Per-key override of the deployment-wide capture_agent_telemetry\
            \ setting: null (default) inherits it, true always stores this key's coding-agent\
            \ telemetry, false always discards it. Covers both behavioral events (tool_result,\
            \ tool_decision, user_prompt, api_error) from POST /v1/logs and outcome-metric\
            \ data points (lines of code, commits, pull requests, active time) from\
            \ POST /v1/metrics. Usage capture and billing are unaffected either way."
          nullable: true
          type: boolean
        exclude_from_budget:
          default: false
          description: "When true, requests on this key are logged with cost but never\
            \ reserved, reconciled into the user's spend, or gated by budget."
          title: Exclude From Budget
          type: boolean
        expires_at:
          description: Optional expiration timestamp
          format: date-time
          nullable: true
          type: string
        key_name:
          description: Optional name for the key
          nullable: true
          type: string
        metadata:
          additionalProperties: true
          description: Optional metadata
          title: Metadata
          type: object
        reject_user_mismatch:
          description: "Per-key override of the deployment-wide reject_user_mismatch\
            \ setting: null (default) inherits it, true always rejects a request naming\
            \ a different 'user', false always accepts it. Spend binds to this key's\
            \ own user either way."
          nullable: true
          type: boolean
        user_id:
          description: Optional user ID to associate with this key
          nullable: true
          type: string
        workspace_id:
          description: "Workspace this key belongs to, which must be one in the caller's\
            \ organization. Omitted means that organization's default workspace. A\
            \ key belongs to exactly one workspace: requests on it are scoped and\
            \ billed there, so the workspace is read off the key rather than off a\
            \ request header."
          format: uuid
          nullable: true
          type: string
      title: CreateKeyRequest
    CreateKeyResponse:
      description: Response model for creating a new API key.
      example:
        metadata:
