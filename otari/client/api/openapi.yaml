      tags:
      - workspace-web-search
components:
  schemas:
    AcceptInvitationRequest:
      example:
        token: token
      properties:
        token:
          title: Token
          type: string
      required:
      - token
      title: AcceptInvitationRequest
    AcceptInvitationResultPublic:
      description: |-
        What accepting produces: enough for the accept page to say where the visitor landed.

        No session and no token: accepting resolves the membership to ``active``
        and stops there. The identity it resolves to is password-less on the roster
        until it is claimed, so the next step is ``POST /v1/auth/signup`` on the
        invited address, not a sign-in.
      example:
        role: role
        organization_name: organization_name
      properties:
        organization_name:
          title: Organization Name
          type: string
        role:
          title: Role
          type: string
      required:
      - organization_name
      - role
      title: AcceptInvitationResultPublic
    ActivationApiKeyPublic:
      description: |-
        The API key the guide hands out, with its plaintext.

        Returned once per call and never stored in plaintext, like every other key
        this gateway mints: a page reload issues a new one and rotates the same row,
        which is what makes the guide able to show a working key without keeping a
        readable secret anywhere.
      example:
        key_name: key_name
        key_id: key_id
        key_prefix: key_prefix
        key: key
      properties:
        key:
          title: Key
          type: string
        key_id:
          title: Key Id
          type: string
        key_name:
          nullable: true
          type: string
        key_prefix:
          nullable: true
          type: string
      required:
      - key
      - key_id
      - key_name
      - key_prefix
      title: ActivationApiKeyPublic
    ActivationAttemptPublic:
