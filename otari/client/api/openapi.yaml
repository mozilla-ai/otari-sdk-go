            \ A row charged only for gateway-run tool calls still counts as needing\
            \ pricing."
          nullable: true
          type: boolean
        style: form
      - description: "Filter to requests that ran a gateway-run tool. 'any' matches\
          \ any tool; a tool name (web_search, code_execution) matches that tool specifically."
        explode: true
        in: query
        name: tool
        required: false
        schema:
          description: "Filter to requests that ran a gateway-run tool. 'any' matches\
            \ any tool; a tool name (web_search, code_execution) matches that tool\
            \ specifically."
          enum:
          - any
          - web_search
          - code_execution
          nullable: true
          type: string
        style: form
      - description: "Filter by budget participation, which is not the same question\
          \ as provenance: true = only enforced gateway rows, false = every row that\
          \ never touches a budget, meaning imported usage and also gateway traffic\
          \ on a budget-exempt key"
        explode: true
        in: query
        name: counts_toward_budget
        required: false
        schema:
          description: "Filter by budget participation, which is not the same question\
            \ as provenance: true = only enforced gateway rows, false = every row\
            \ that never touches a budget, meaning imported usage and also gateway\
            \ traffic on a budget-exempt key"
          nullable: true
          type: boolean
        style: form
      - description: Only usage recorded in this workspace.
        explode: true
        in: query
        name: workspace_id
        required: false
        schema:
          description: Only usage recorded in this workspace.
          format: uuid
          nullable: true
          type: string
        style: form
      - description: "Time-series granularity: 'hour' or 'day'"
        explode: true
        in: query
        name: bucket
        required: false
        schema:
          default: day
          description: "Time-series granularity: 'hour' or 'day'"
          enum:
          - hour
          - day
          title: Bucket
          type: string
        style: form
      - description: "Which breakdowns to compute; repeatable (dimensions=model&dimensions=user).\
          \ Each value names the 'by_<value>' response field it fills, except 'status_code',\
          \ which fills the failure taxonomy in 'errors_by_status_code'. Omit for\
          \ every breakdown (the default); pass 'none' for a totals-and-series-only\
          \ response. Each dimension left out skips one GROUP BY scan, so a caller\
          \ that reads only the tiles or the time series should say so. Fields that\
          \ were not requested come back empty."
        explode: true
        in: query
        name: dimensions
        required: false
        schema:
          description: "Which breakdowns to compute; repeatable (dimensions=model&dimensions=user).\
            \ Each value names the 'by_<value>' response field it fills, except 'status_code',\
            \ which fills the failure taxonomy in 'errors_by_status_code'. Omit for\
            \ every breakdown (the default); pass 'none' for a totals-and-series-only\
            \ response. Each dimension left out skips one GROUP BY scan, so a caller\
            \ that reads only the tiles or the time series should say so. Fields that\
            \ were not requested come back empty."
          items:
            enum:
            - model
            - user
            - api_key
            - source
            - source_label
            - endpoint
            - provider
            - status_code
            - tool
            - none
            type: string
          nullable: true
          type: array
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Usage Summary
      tags:
      - usage
