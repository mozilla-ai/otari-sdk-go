    ExplainRequest:
      description: |-
        Ask what a policy would do, without dispatching anything.

        Either name a stored/configured policy (``name``) or pass a draft ``spec`` that
        has not been saved. The draft form is what makes authoring-time validation
        possible: the compiler filters candidates, so a chain can compile down to one
        attempt, and an author needs to see that before saving rather than during an
        outage.
      example:
        workspace_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        budget_used_pct: 6.027456183070403
        key_id: key_id
        user_id: user_id
        name: name
        budget_remaining_usd: 0.8008281904610115
        allowed_models:
        - allowed_models
        - allowed_models
        spec:
          key: ""
      properties:
        allowed_models:
          description: Simulate an API key's allow-list. Omit for unrestricted.
          items:
            type: string
          nullable: true
          type: array
        budget_remaining_usd:
          description: "Simulated budget remaining, USD."
          nullable: true
          type: number
        budget_used_pct:
          description: Simulated budget usage percentage.
          nullable: true
          type: number
        key_id:
          description: Evaluate conditions as this API key id.
          nullable: true
          type: string
        name:
          description: An existing policy to explain.
          nullable: true
          type: string
        spec:
          additionalProperties: true
          description: "Provider-native request fields used as defaults (e.g. exa's\
            \ 'type', searxng's 'engines')."
          nullable: true
          type: object
        user_id:
          description: Evaluate conditions as this user.
          nullable: true
          type: string
        workspace_id:
          description: Resolve `name` and the policy's candidate selectors in this
            workspace. Omit for the deployment's default workspace.
          format: uuid
          nullable: true
          type: string
      title: ExplainRequest
    ExplainResponse:
      description: The plan a policy compiles to for the given inputs.
      example:
        candidates:
        - instance: instance
          selection_reason: selection_reason
          dispatch_model: dispatch_model
          model: model
          position: 0
        - instance: instance
          selection_reason: selection_reason
          dispatch_model: dispatch_model
          model: model
          position: 0
        router_candidates:
        - router_candidates
        - router_candidates
        selection_reason: selection_reason
        dropped:
        - reason: reason
          selector: selector
          detail: detail
        - reason: reason
          selector: selector
          detail: detail
        guardrails:
        - key: ""
        - key: ""
        is_dynamic: true
        name: name
        router_backend: router_backend
        router_weights:
          key: 6.027456183070403
      properties:
        candidates:
          items:
            $ref: "#/components/schemas/CandidateResponse"
          title: Candidates
          type: array
        dropped:
          items:
            $ref: "#/components/schemas/DroppedResponse"
          title: Dropped
          type: array
        guardrails:
          items:
            additionalProperties: true
            description: "Provider-native request fields used as defaults (e.g. exa's\
              \ 'type', searxng's 'engines')."
            nullable: true
            type: object
          title: Guardrails
          type: array
        is_dynamic:
          title: Is Dynamic
          type: boolean
        name:
          title: Name
          type: string
        router_backend:
          nullable: true
          type: string
        router_candidates:
          items:
            type: string
          title: Router Candidates
          type: array
        router_weights:
          additionalProperties:
            type: number
          description: "For a weighted policy, the percentage of traffic each candidate\
            \ receives, normalized over the candidates this caller may use. Empty\
            \ for every other policy, and for a weighted policy whose whole split\
            \ this caller may not use: a split over no candidate is not a split, and\
            \ each filtered candidate is named in `dropped` instead. A weighted split\
            \ needs no request state, so unlike a learned router's ranking it is knowable\
            \ here: the plan above is the real ordering by share, not the decline\
            \ path."
          title: Router Weights
        selection_reason:
          title: Selection Reason
          type: string
      required:
      - candidates
      - dropped
      - guardrails
      - is_dynamic
      - name
      - selection_reason
      title: ExplainResponse
