    OrganizationGuardrailCreate:
      description: |-
        Request body for mandating a guardrail across an organization.

        ``credential`` is never stored as sent: it is encrypted with
        ``OTARI_SECRET_KEY`` and only the ciphertext is kept, the same convention
        `entities.WorkspaceMcpServer` and `entities.ProviderCredential` use. It is
        sent to the endpoint as ``Authorization: Bearer`` when the guardrail runs,
        so it authenticates this gateway to the guardrails service the entry names.
        A guardrail *vendor's* own key is not this: the guardrails service builds
        its guardrails from the operator's YAML and holds those itself.

        A credential therefore requires ``url``. The deployment's ``guardrails_url``
        is not necessarily encrypted (the shipped compose file makes it a same-host
        ``http://`` sidecar) and this row cannot see what it is set to, so an entry
        that fell back to it could not promise the bearer was sent over https. See
        `_require_url_for_credential`.

        ``on`` is not offered. This plane mandates input-direction checks, which is
        the only direction the request path enforces
        (`services.guardrails.run_input_guardrails`); an organization that could
        store an output-direction mandate would be storing one nothing runs.
      example:
        applies_to_all_workspaces: true
        credential: sk-guardrails-...
        mode: block
        profile: prompt-injection
        url: https://guardrails.internal.example/validate
      properties:
        applies_to_all_workspaces:
          default: false
          description: "True runs this in every workspace of the organization, including\
            \ one created later; false runs it only in the workspaces named by workspace_ids"
          title: Applies To All Workspaces
          type: boolean
        credential:
          description: "Bearer credential for this entry's endpoint. Requires url\
            \ to be set, and https: an entry with no endpoint of its own falls back\
            \ to the deployment's guardrails_url, which is commonly a same-host http\
            \ sidecar. Encrypted at rest, never returned"
          maxLength: 8192
          nullable: true
          type: string
        enabled:
          default: true
          description: False stops the guardrail everywhere without discarding it
          title: Enabled
          type: boolean
        mode:
          default: monitor
          description: block rejects a flagged request with 403; monitor annotates
            the response and forwards it
          enum:
          - block
          - monitor
          title: Mode
          type: string
        on_unavailable:
          default: block
          description: What a block-mode entry does when the guardrails service cannot
            be reached at all
          enum:
          - block
          - monitor
          title: On Unavailable
          type: string
        profile:
          description: "Profile name configured on the guardrails service, unique\
            \ within the organization"
          maxLength: 128
          minLength: 1
          title: Profile
          type: string
        url:
          description: Guardrails endpoint for this entry; null uses the deployment's
            guardrails_url
          maxLength: 2048
          nullable: true
          type: string
        validate_kwargs:
          additionalProperties: true
          description: "Provider-native request fields used as defaults (e.g. exa's\
            \ 'type', searxng's 'engines')."
          nullable: true
          type: object
        workspace_ids:
          description: Workspaces this guardrail runs in. Must be empty when applies_to_all_workspaces
            is true
          items:
            format: uuid
            type: string
          maxItems: 500
          title: Workspace Ids
          type: array
      required:
      - profile
      title: OrganizationGuardrailCreate
    OrganizationGuardrailPublic:
      description: "The API-facing shape. Never carries the credential, only whether\
        \ one is set."
      example:
        validate_kwargs:
          key: ""
        profile: profile
        created_at: created_at
        on_unavailable: on_unavailable
        applies_to_all_workspaces: true
        workspace_ids:
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        - 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        enabled: true
        url: url
        mode: mode
        has_credential: true
        updated_at: updated_at
        organization_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
      properties:
        applies_to_all_workspaces:
          title: Applies To All Workspaces
          type: boolean
        created_at:
          title: Created At
          type: string
        enabled:
          title: Enabled
          type: boolean
        has_credential:
          title: Has Credential
          type: boolean
        id:
          format: uuid
          title: Id
          type: string
        mode:
          title: Mode
          type: string
        on_unavailable:
          title: On Unavailable
          type: string
        organization_id:
          format: uuid
          title: Organization Id
          type: string
        profile:
          title: Profile
          type: string
        updated_at:
          title: Updated At
          type: string
        url:
          nullable: true
          type: string
        validate_kwargs:
          additionalProperties: true
          description: "Provider-native request fields used as defaults (e.g. exa's\
            \ 'type', searxng's 'engines')."
          nullable: true
          type: object
        workspace_ids:
          items:
            format: uuid
            type: string
          title: Workspace Ids
          type: array
      required:
