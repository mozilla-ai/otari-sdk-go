    WorkspaceWebSearchConfigUpdate:
      description: |-
        The configuration to store for a workspace, as a whole.

        ``PUT`` semantics, ported from the hosted ``WorkspaceWebSearchConfigUpdate``:
        what is sent is what the workspace has afterwards, so an omitted field is
        cleared rather than left as it was.
      example:
        provider_options:
          key: ""
        allowed_domains:
        - allowed_domains
        - allowed_domains
        blocked_domains:
        - blocked_domains
        - blocked_domains
        max_results: 1
        enabled: true
        purpose_hint: purpose_hint
      properties:
        allowed_domains:
          description: Results are kept only from these domains; intersected with
            any list the request sends
          items:
            type: string
          nullable: true
          type: array
        blocked_domains:
          description: Results from these domains are dropped; added to any list the
            request sends
          items:
            type: string
          nullable: true
          type: array
        enabled:
          description: "False refuses web search for this workspace, both the otari_web_search\
            \ tool and POST /v1/search. The fields below narrow the tool only."
          title: Enabled
          type: boolean
        max_results:
          description: "Ceiling on results one search returns; only ever lowers the\
            \ effective limit, so at most 20"
          exclusiveMinimum: true
          maximum: 20.0
          minimum: 0.0
          nullable: true
          type: integer
        provider_options:
          additionalProperties: true
          description: "Provider-native request fields used as defaults (e.g. exa's\
            \ 'type', searxng's 'engines')."
          nullable: true
          type: object
        purpose_hint:
          description: Hint used when a request declares otari_web_search without
            one of its own
          maxLength: 2048
          nullable: true
          type: string
      required:
      - enabled
      title: WorkspaceWebSearchConfigUpdate
