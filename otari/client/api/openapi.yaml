          description: "The password being replaced. Required when the identity already\
            \ has one and the request is authenticated by the session cookie; ignored\
            \ when the master key is sent in a header, which needs no proof of the\
            \ old password (it still needs `email` when the identity has no sign-in\
            \ address yet)."
          maxLength: 1024
          nullable: true
          type: string
        email:
          description: "The address to sign in with. Required when the identity has\
            \ none, which is the state first boot leaves the operator in, including\
            \ when the master key is what authenticates the call. Resubmitting the\
            \ address the identity already holds is accepted and ignored; only a *different*\
            \ address is refused, because changing one is not supported yet."
          maxLength: 255
          nullable: true
          type: string
        new_password:
          description: "The password to sign in with from now on. At least 8 characters,\
            \ and at most 72 bytes, which is bcrypt's ceiling."
          maxLength: 1024
          minLength: 8
          title: New Password
          type: string
      required:
      - new_password
      title: SetPasswordRequest
    SetPricingRequest:
      description: "Create a versioned per-model price, with optional cache and context\
        \ tiers."
