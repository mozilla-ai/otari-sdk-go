    WorkspaceMcpServerCreate:
      description: |-
        Request body for registering a server.

        ``authorization_token`` is never stored as sent: it is encrypted with
        ``OTARI_SECRET_KEY`` and only the ciphertext is kept, the same convention
        `entities.ProviderCredential` and `OrgProviderKey` already use.
      example:
        authorization_token: authorization_token
        allowed_tools:
        - allowed_tools
        - allowed_tools
        - allowed_tools
        - allowed_tools
        - allowed_tools
        name: name
        enabled: true
        url: url
        purpose_hint: purpose_hint
      properties:
        allowed_tools:
          description: Allow-list of tool names; null exposes every tool the server
            offers
          items:
            maxLength: 256
            type: string
          maxItems: 200
          nullable: true
          type: array
        authorization_token:
          description: "Bearer token for the server; requires an https URL. Encrypted\
            \ at rest, never returned"
          maxLength: 8192
          nullable: true
          type: string
        enabled:
          default: true
          description: Whether a request naming this server actually reaches it
          title: Enabled
          type: boolean
        name:
          description: "Label for the server, unique within the workspace"
          maxLength: 128
          minLength: 1
          title: Name
          type: string
        purpose_hint:
          description: Hint prepended to the system message to help the model choose
          maxLength: 2000
          nullable: true
          type: string
        url:
          description: Streamable HTTP MCP endpoint
          maxLength: 2048
          minLength: 1
          title: Url
          type: string
      required:
      - name
      - url
      title: WorkspaceMcpServerCreate
