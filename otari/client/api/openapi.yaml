      operationId: delete_budget_v1_budgets__budget_id__delete
      parameters:
      - explode: false
        in: path
        name: budget_id
        required: true
        schema:
          title: Budget Id
          type: string
        style: simple
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Budget
      tags:
      - budgets
    get:
      description: Get details of a specific budget.
      operationId: get_budget_v1_budgets__budget_id__get
      parameters:
      - explode: false
        in: path
        name: budget_id
        required: true
        schema:
          title: Budget Id
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Get Budget
      tags:
      - budgets
    patch:
      description: Update a budget.
      operationId: update_budget_v1_budgets__budget_id__patch
      parameters:
      - explode: false
        in: path
        name: budget_id
        required: true
        schema:
          title: Budget Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateBudgetRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
