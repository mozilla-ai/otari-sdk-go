          nullable: true
          type: string
        style: form
      - description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: api_key_id
        required: false
        schema:
          description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter by token-pricing state: true = only rows whose model\
          \ tokens were priced, false = only rows that still need pricing (no cost\
          \ at all, or tokens that were never metered because the model had no rate).\
          \ A row charged only for gateway-run tool calls still counts as needing\
          \ pricing."
        explode: true
        in: query
        name: priced
        required: false
        schema:
          description: "Filter by token-pricing state: true = only rows whose model\
            \ tokens were priced, false = only rows that still need pricing (no cost\
            \ at all, or tokens that were never metered because the model had no rate).\
            \ A row charged only for gateway-run tool calls still counts as needing\
            \ pricing."
          nullable: true
          type: boolean
        style: form
      - description: "Filter to requests that ran a gateway-run tool. 'any' matches\
          \ any tool; a tool name (web_search, code_execution) matches that tool specifically."
        explode: true
        in: query
        name: tool
        required: false
        schema:
          description: "Filter to requests that ran a gateway-run tool. 'any' matches\
            \ any tool; a tool name (web_search, code_execution) matches that tool\
            \ specifically."
          enum:
          - any
          - web_search
          - code_execution
          nullable: true
          type: string
        style: form
      - description: "Filter by budget participation, which is not the same question\
          \ as provenance: true = only enforced gateway rows, false = every row that\
          \ never touches a budget, meaning imported usage and also gateway traffic\
          \ on a budget-exempt key"
        explode: true
        in: query
        name: counts_toward_budget
        required: false
        schema:
          description: "Filter by token-pricing state: true = only rows whose model\
            \ tokens were priced, false = only rows that still need pricing (no cost\
            \ at all, or tokens that were never metered because the model had no rate).\
            \ A row charged only for gateway-run tool calls still counts as needing\
            \ pricing."
          nullable: true
          type: boolean
        style: form
      - description: "Filter to the rows of one or more request groups; repeatable\
          \ (request_group_id=a&request_group_id=b). A routed request writes one row\
          \ per attempt, all sharing a request_group_id, so this returns a request's\
          \ whole plan: its absorbed attempts and the attempt that served it. Ignore\
          \ ordering by timestamp and read attempt_position to reconstruct the plan.\
          \ At most 1000 ids per call."
        explode: true
        in: query
        name: request_group_id
        required: false
        schema:
          description: "Filter to the rows of one or more request groups; repeatable\
