      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Get Settings
      tags:
      - settings
    patch:
      description: |-
        Persist and apply runtime setting changes.

        Each provided field is stored as an override (winning over config/env) and
        applied to the running gateway immediately. Master-key gated: these change
        how the gateway meters and lists models.
      operationId: update_settings_v1_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GatewaySettings"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Update Settings
      tags:
      - settings
  /v1/settings/master-key/rotate:
    post:
      description: |-
        Regenerate the database-backed master key and invalidate the old one.

        Only the first-run generated master key can be rotated here. When a master
        key is supplied through config or ``OTARI_MASTER_KEY``, the dashboard cannot
        invalidate it; the operator must change that value and restart instead.

        Every dashboard session is revoked with the rotation (a session only proves
        possession of the now-dead key); the caller's own session is re-minted under
        the new key so the tab that performed the rotation stays signed in.
      operationId: rotate_master_key_v1_settings_master_key_rotate_post
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RotateMasterKeyResponse"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Rotate Master Key
      tags:
      - settings
  /v1/tool-settings:
    get:
      description: Return the effective tool/guardrail settings for the dashboard.
      operationId: get_tool_settings_v1_tool_settings_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSettingsResponse"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Get Tool Settings
      tags:
      - tool-settings
    patch:
      description: |-
        Persist and apply tool/guardrail setting changes.

        Uses ``model_fields_set`` so an explicit ``null`` clears a field while an
        omitted field is left unchanged. Master-key gated and standalone-only.
      operationId: update_tool_settings_v1_tool_settings_patch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateToolSettingsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolSettingsResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Update Tool Settings
      tags:
      - tool-settings
  /v1/tool-settings/{service}/test:
    post:
      description: |-
        Structurally validate a URL and probe it for reachability.

        Tests the URL in the request body (typically unsaved), so an operator can
        verify before saving. The probe is a plain HTTP GET with a short timeout: any
        HTTP response means the host is reachable; a connection/timeout/DNS error means
        it is not. The operator is trusted (master key), so no SSRF deny-list applies;
        only the structural check (http/https + host) runs first.
      operationId: test_service_v1_tool_settings__service__test_post
      parameters:
      - explode: false
        in: path
        name: service
        required: true
        schema:
          title: Service
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TestServiceRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestServiceResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Test Service
      tags:
      - tool-settings
  /v1/tools:
    get:
      description: |-
        List the tools Otari runs itself, with the declaration forms it accepts.

        Every other `tools[]` entry, including provider-native keywords not listed
        here, is forwarded to the upstream provider untouched.
      operationId: list_tools_v1_tools_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ToolsResponse"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Tools
      tags:
      - tools
  /v1/traces:
    post:
      description: Ingest LLM usage from OTLP spans (GenAI semantic conventions).
      operationId: receive_traces_v1_traces_post
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Receive Traces
      tags:
      - otel
  /v1/usage:
    delete:
      description: |-
        Delete imported usage rows by explicit ids or by filter (standalone).

        Target either the current selection (``ids``) or everything matching a filter
        (``by_filter: true`` plus optional ``source`` / ``model`` / ``user_id`` /
        ``status`` / date range / ``priced``). Only imported rows
        (``counts_toward_budget = false``) are ever removed: enforced gateway rows and
        the spend ledger (``users.spend``) are untouched, so a delete can never desync a
        budget. Master-key only.
      operationId: delete_usage_rows_v1_usage_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageDeleteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageDeleteResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Usage Rows
      tags:
      - usage
    get:
      description: |-
        List usage logs ordered by timestamp (most recent first).

        Supports optional filters for time range, user, status, failure status code,
        model, endpoint, provider, source, session (``source_label``), and request
        group (``request_group_id``, repeatable, which returns a routed request's
        whole attempt plan). Paginated via skip/limit. The return shape is a bare JSON array; external
        billing/analytics consumers depend on this, so the total row count for a
        paginated UI is served separately by ``GET /v1/usage/count`` rather than
        wrapped in an envelope here. Timestamps accept either ISO 8601 strings or
        Unix epoch seconds (numeric).
      operationId: list_usage_v1_usage_get
      parameters:
      - description: Return logs with timestamp >= start_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: ISO datetime for effective lookup
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return logs with timestamp < end_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: ISO datetime for effective lookup
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Filter to one or more users; repeatable (user_id=a&user_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Filter to one or more users; repeatable (user_id=a&user_id=b).
            Several values match any of them. At most 50 per call.
          items:
            description: Delete the alias scoped to this user. Omit to delete the
              global alias of that name.
            nullable: true
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter to a single status: 'success', 'error', or 'absorbed'\
          \ (an attempt a routing policy recovered from, excluded from error_count\
          \ and request_count)"
        explode: true
        in: query
        name: status
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      - description: "Filter to a single failure status code (e.g. 429 for provider\
          \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
          \ one, so this filter also restricts to status='error' unless 'status' is\
          \ given explicitly"
        explode: true
        in: query
        name: status_code
        required: false
        schema:
          description: "Filter to a single failure status code (e.g. 429 for provider\
            \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
            \ one, so this filter also restricts to status='error' unless 'status'\
            \ is given explicitly"
          nullable: true
          type: integer
        style: form
      - description: Filter to one or more models; repeatable (model=a&model=b). Several
          values match any of them. At most 50 per call.
        explode: true
        in: query
        name: model
        required: false
        schema:
          description: Filter to one or more models; repeatable (model=a&model=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: Filter to a single endpoint (e.g. '/v1/chat/completions')
        explode: true
        in: query
        name: endpoint
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      - description: Filter to a single provider (e.g. 'openai')
        explode: true
        in: query
        name: provider
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      - description: Filter to a single provenance source (e.g. 'gateway' or 'claude_code')
        explode: true
        in: query
        name: source
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      - description: Filter to a single session/project label (the source_label carried
          by imported usage)
        explode: true
        in: query
        name: source_label
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      - description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: api_key_id
        required: false
        schema:
          description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter by token-pricing state: true = only rows whose model\
          \ tokens were priced, false = only rows that still need pricing (no cost\
          \ at all, or tokens that were never metered because the model had no rate).\
          \ A row charged only for gateway-run tool calls still counts as needing\
          \ pricing."
        explode: true
        in: query
        name: priced
        required: false
        schema:
          description: "Filter by token-pricing state: true = only rows whose model\
            \ tokens were priced, false = only rows that still need pricing (no cost\
