      description: |-
        The policy to store for a workspace, as a whole.

        ``PUT`` semantics, ported from the hosted ``CodeExecutionConfigUpsert``:
        what is sent is what the workspace has afterwards, so an omitted limit is
        cleared rather than left as it was.
      example:
        max_iterations: 15
        image: image
        exec_timeout_s: 4
        default_purpose_hint: default_purpose_hint
        tools:
        - tools
        - tools
        enabled: true
      properties:
        default_purpose_hint:
          description: Hint used when a request declares otari_code_execution without
            one of its own
          maxLength: 2048
          nullable: true
          type: string
        enabled:
          description: False refuses code execution for this workspace
          title: Enabled
          type: boolean
        exec_timeout_s:
          description: "Ceiling on one execution's runtime in seconds; only ever lowers\
            \ the effective limit, so at most 60"
          exclusiveMinimum: true
          maximum: 60.0
          minimum: 0.0
          nullable: true
          type: integer
        image:
          description: Sandbox image this workspace's code runs in. Must be one the
            operator curated into sandbox_allowed_session_images (or the deployment's
            own sandbox_session_image); null uses the deployment's
          maxLength: 255
          nullable: true
          type: string
        max_iterations:
          description: "Ceiling on tool-loop iterations; only ever lowers the effective\
            \ limit, so at most 25"
          exclusiveMinimum: true
          maximum: 25.0
          minimum: 0.0
          nullable: true
          type: integer
        tools:
          description: "Code-execution tool kinds this workspace may use, from code_execution,\
            \ bash_code_execution, text_editor_code_execution. Only ever removes one\
            \ the backend serves; null exposes whatever it serves"
          items:
            type: string
          nullable: true
          type: array
      required:
      - enabled
      title: WorkspaceCodeExecutionPolicyUpdate
