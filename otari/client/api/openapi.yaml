openapi: 3.1.0
info:
  description: "Otari, an OpenAI-compatible LLM gateway with API key management"
  title: otari
  version: 0.0.0-dev
servers:
- url: /
paths:
  /health:
    get:
      description: |-
        General health check endpoint.

        Returns basic health status. For infrastructure monitoring,
        use /health/readiness or /health/liveness instead.
      operationId: health_check_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Check Health Get
          description: Successful Response
      summary: Health Check
      tags:
      - health
  /health/liveness:
    get:
      description: |-
        Liveness probe endpoint.

        Simple check to verify the process is alive and responding.
        Used by Kubernetes/container orchestrators for liveness probes.

        Returns:
            Plain text "I'm alive!" message
      operationId: health_liveness_health_liveness_get
      responses:
        "200":
          content:
            application/json:
              schema:
                title: Response Health Liveness Health Liveness Get
                type: string
          description: Successful Response
      summary: Health Liveness
      tags:
      - health
  /health/readiness:
    get:
      description: |-
        Readiness probe endpoint.

        Checks if the gateway is ready to serve requests by validating:
        - Database connectivity
        - Service availability

        Used by Kubernetes/container orchestrators for readiness probes.
        Returns HTTP 503 if any dependency is unavailable.

        Returns:
            dict: Status object with health details

        Raises:
            HTTPException: 503 if service is not ready
      operationId: health_readiness_health_readiness_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Health Readiness Health Readiness Get
          description: Successful Response
      summary: Health Readiness
      tags:
      - health
  /v1/admin/access:
    get:
      description: |-
        Report whether the caller may use the deployment administration surface.

        The one endpoint here that answers 200 for everybody. The rest refuse a
        non-operator with 404 so they do not confirm they exist, which leaves a
        dashboard nothing to gate its navigation on but a failed request; this says
        the same thing without one. It publishes only the caller's own standing,
        which they could establish by trying an endpoint anyway.
      operationId: get_administration_access_v1_admin_access_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentAdminAccessPublic"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Get Administration Access
      tags:
      - admin
  /v1/admin/users:
    get:
      description: |-
        List every account on this deployment, with the organizations each belongs to.

        Deployment-wide, so it is not the same list as ``GET /v1/organizations/me/members``:
        that one is the caller's organization roster and drops a suspended
        membership, while this one carries every identity at whatever standing,
        including one whose memberships are all suspended. Each row also reports when
        the account last signed in to the dashboard, and null there means never.
      operationId: list_deployment_users_v1_admin_users_get
      parameters:
      - description: Number of records to skip
        explode: true
        in: query
        name: skip
        required: false
        schema:
          default: 0
          description: Number of records to skip
          minimum: 0
          title: Skip
          type: integer
        style: form
      - description: Maximum number of records to return
        explode: true
        in: query
        name: limit
        required: false
        schema:
          default: 100
          description: Maximum number of records to return
          maximum: 1000
          minimum: 1
          title: Limit
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentUsersPublic"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Deployment Users
      tags:
      - admin
  /v1/admin/users/{user_id}:
    patch:
      description: |-
        Deactivate or reactivate an account, or change whether it may administer this deployment.

        Both fields are optional and omitting one leaves it alone; a body naming
        neither is refused rather than treated as a no-op. Deactivating also ends
        that account's dashboard sessions immediately, so a lost laptop stops
        working now rather than when its cookie is next presented.

        Two changes are refused to keep a deployment reachable: an operator may not
        deactivate their own account or drop their own operator access, and neither
        may be taken from the deployment's bootstrap operator, which is the identity
        master-key sign-in resolves to. Granting either is unguarded.
      operationId: update_deployment_user_v1_admin_users__user_id__patch
      parameters:
      - explode: false
        in: path
        name: user_id
        required: true
        schema:
          format: uuid
          title: User Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeploymentUserUpdateRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeploymentUserPublic"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Update Deployment User
      tags:
      - admin
  /v1/agent-telemetry:
    delete:
      description: |-
        Delete agent_telemetry rows by explicit ids or by filter (standalone).

        Target either an explicit selection (`ids`) or everything matching a filter
        (`by_filter: true` plus optional `user_id` / `api_key_id` / `name` / date
        range). A selection matching zero rows succeeds with `deleted: 0`.
        Master-key only.
      operationId: delete_agent_telemetry_rows_v1_agent_telemetry_delete
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentTelemetryDeleteRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTelemetryDeleteResult"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Agent Telemetry Rows
      tags:
      - agent-telemetry
  /v1/agent-telemetry/count:
    get:
      description: |-
        Total agent_telemetry rows matching the given filters (standalone).

        The filter set mirrors the purge endpoint's, so this sizes exactly what a
        "delete all N matching" would remove. Behavioral and metric rows are counted
        together: neither this nor the purge distinguishes them. Master-key only.
      operationId: count_agent_telemetry_v1_agent_telemetry_count_get
      parameters:
      - description: Return rows with timestamp >= start_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Return rows with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return rows with timestamp < end_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: Return rows with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Filter to one or more users; repeatable (user_id=a&user_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Filter to one or more users; repeatable (user_id=a&user_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: api_key_id
        required: false
        schema:
          description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter to a single event type or metric name (e.g. 'tool_result',\
          \ 'claude_code.commit.count')"
        explode: true
        in: query
        name: name
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTelemetryCount"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Count Agent Telemetry
      tags:
      - agent-telemetry
  /v1/agent-telemetry/series:
    get:
      description: |-
        Row volume over time, split by user or API key (standalone).

        Mirrors `/v1/usage/series`: same window bounds and bucket-grid cap, the top
        groups as their own series with the remainder folded into a reconciling
        ``other``, and sparse points (populated cells only). Counts rows, not spend,
        so it charts telemetry volume rather than cost. Master-key only.
      operationId: agent_telemetry_series_v1_agent_telemetry_series_get
      parameters:
      - description: Dimension to split the series by
        explode: true
        in: query
        name: group_by
        required: true
        schema:
          description: Dimension to split the series by
          enum:
          - user_id
          - api_key_id
          title: Group By
          type: string
        style: form
      - description: Return rows with timestamp >= start_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Return rows with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return rows with timestamp < end_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: Return rows with timestamp < end_date (ISO 8601 or Unix epoch
            seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Filter to one or more users; repeatable (user_id=a&user_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Filter to one or more users; repeatable (user_id=a&user_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: api_key_id
        required: false
        schema:
          description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter to a single event type or metric name (e.g. 'tool_result',\
          \ 'claude_code.commit.count')"
        explode: true
        in: query
        name: name
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      - description: "Time-series granularity: 'hour' or 'day'"
        explode: true
        in: query
        name: bucket
        required: false
        schema:
          default: day
          description: "Time-series granularity: 'hour' or 'day'"
          enum:
          - hour
          - day
          title: Bucket
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTelemetryGroupedSeries"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Agent Telemetry Series
      tags:
      - agent-telemetry
  /v1/agent-telemetry/summary:
    get:
      description: |-
        What the coding agent produced in a window, and what it cost (standalone).

        Range-bounded like `/v1/usage/summary` (default last 30 days, hard-capped),
        so the aggregates stay served by the timestamp index. Returns the outcome
        totals (commits, pull requests, lines changed, active time), the behavioral
        counts already captured from the logs signal (tool calls and their mix, tool
        accept/reject, turns, API errors), the recorded spend over the same scope,
        and the derived per-unit measures: cost per commit / pull request / line,
        spend per active hour, acceptance rate, turns per session, and error rate.
        Each measure is null rather than an error when its denominator is zero.
        Filterable by user, API key, and `session_label`, so cost per outcome can be
        read for one agent session as well as for a whole window.

        The spend side is every usage row in scope, not only the agent's: unfiltered,
        that includes traffic from clients that never reported telemetry, so a
        per-outcome measure read over a whole deployment answers "what did this
        deployment spend per commit", not "what did the agent spend per commit".
        Filter by user, API key, or session to divide only the matching spend.

        Outcome metrics are stored exactly as the agent reported them, so a
        cumulative counter is converted to a window increment here, at read time,
        diffed per series generation: a re-exported total adds nothing, and a counter
        reset never reads as negative work. Master-key only.
      operationId: agent_telemetry_summary_v1_agent_telemetry_summary_get
      parameters:
      - description: Return rows with timestamp >= start_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: start_date
        required: false
        schema:
          description: Return rows with timestamp >= start_date (ISO 8601 or Unix
            epoch seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Return rows with timestamp < end_date (ISO 8601 or Unix epoch
          seconds)
        explode: true
        in: query
        name: end_date
        required: false
        schema:
          description: Return rows with timestamp < end_date (ISO 8601 or Unix epoch
            seconds)
          format: date-time
          nullable: true
          type: string
        style: form
      - description: Filter to one or more users; repeatable (user_id=a&user_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Filter to one or more users; repeatable (user_id=a&user_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
          Several values match any of them. At most 50 per call.
        explode: true
        in: query
        name: api_key_id
        required: false
        schema:
          description: Filter to one or more API key ids; repeatable (api_key_id=a&api_key_id=b).
            Several values match any of them. At most 50 per call.
          items:
            type: string
          maxItems: 50
          nullable: true
          type: array
        style: form
      - description: "Filter to a single agent session. Matches agent_telemetry.session_label\
          \ and, on the usage side of the join, the usage_logs.source_label that /v1/usage/summary\
          \ filters on"
        explode: true
        in: query
        name: session_label
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      - description: "Time-series granularity: 'hour' or 'day'"
        explode: true
        in: query
        name: bucket
        required: false
        schema:
          default: day
          description: "Time-series granularity: 'hour' or 'day'"
          enum:
          - hour
          - day
          title: Bucket
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTelemetrySummary"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Agent Telemetry Summary
      tags:
      - agent-telemetry
  /v1/aliases:
    get:
      description: |-
        List every alias in force, from config.yml and from storage.

        Every scope at once, workspace-wide and user-scoped alike: this is the
        master-key management view, not what any one caller resolves.
      operationId: list_aliases_v1_aliases_get
      parameters:
      - description: "Only stored entries in this workspace. Config-file entries are\
          \ always included, being deployment-wide. Omit to list the stored entries\
          \ of every workspace."
        explode: true
        in: query
        name: workspace_id
        required: false
        schema:
          description: "Only stored entries in this workspace. Config-file entries\
            \ are always included, being deployment-wide. Omit to list the stored\
            \ entries of every workspace."
          format: uuid
          nullable: true
          type: string
        style: form
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AliasResponse"
                title: Response List Aliases V1 Aliases Get
                type: array
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Aliases
      tags:
      - aliases
    post:
      description: "Create or update a stored alias in one workspace, optionally for\
        \ one user."
      operationId: set_alias_v1_aliases_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Set Alias
      tags:
      - aliases
  /v1/aliases/{name}:
    delete:
      description: Delete a stored alias in one scope.
      operationId: delete_alias_v1_aliases__name__delete
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
        style: simple
      - description: Delete the alias scoped to this user. Omit to delete the workspace-wide
          alias of that name.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      - description: Delete the alias in this workspace. Omit for the deployment's
          default workspace.
        explode: true
        in: query
        name: workspace_id
        required: false
        schema:
          description: Delete the alias in this workspace. Omit for the deployment's
            default workspace.
          format: uuid
          nullable: true
          type: string
        style: form
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Alias
      tags:
      - aliases
  /v1/audio/speech:
    post:
      description: |-
        OpenAI-compatible audio speech (TTS) endpoint.

        Authentication modes:
        - Master key + user field: Use specified user (must exist)
        - API key + user field: Use specified user (must exist)
        - API key without user field: Use the shared "default" user
      operationId: create_speech_v1_audio_speech_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioSpeechRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
            audio/L16:
              schema:
                format: binary
                type: string
            audio/aac:
              schema:
                format: binary
                type: string
            audio/flac:
              schema:
                format: binary
                type: string
            audio/mpeg:
              schema:
                format: binary
                type: string
            audio/opus:
              schema:
                format: binary
                type: string
            audio/wav:
              schema:
                format: binary
                type: string
          description: Audio bytes in the requested format
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Speech
      tags:
      - audio
  /v1/audio/transcriptions:
    post:
      description: |-
        OpenAI-compatible audio transcription endpoint.

        Authentication modes:
        - Master key + user field: Use specified user (must exist)
        - API key + user field: Use specified user (must exist)
        - API key without user field: Use the shared "default" user
      operationId: create_transcription_v1_audio_transcriptions_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_create_transcription_v1_audio_transcriptions_post"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Transcription
      tags:
      - audio
  /v1/auth/oauth/{provider}/authorize:
    get:
      description: |-
        Start an OAuth sign-in: where to send the browser, and the state to keep.

        A GET, and safe: it reads configuration and mints a random value, writing
        nothing. Repeating it simply produces another state, and only the one the
        browser kept is the one it will compare against.
      operationId: authorize_v1_auth_oauth__provider__authorize_get
      parameters:
      - description: Which OAuth provider to sign in with.
        explode: false
        in: path
        name: provider
        required: true
        schema:
          description: Which OAuth provider to sign in with.
          pattern: ^(github|google)$
          title: Provider
          type: string
        style: simple
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorizeResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Authorize
      tags:
      - auth
  /v1/auth/oauth/{provider}/callback:
    post:
      description: |-
        Exchange an authorization code and set the HttpOnly session cookie.

        The session is bound to the identity the provider's account resolves to,
        exactly as a password sign-in binds one to the identity that authenticated,
        so every request it later authenticates resolves the same caller.

        A refusal is counted like the other sign-in failures
        (``record_auth_failure``) and rendered by the tenancy error handler. Like
        the passkey route there is no separate post-failure throttle: this route is
        throttled unconditionally on the way in, because there is no legitimate
        caller here whose correct credential must never be blocked. An authorization
        code is single-use and minted by a redirect, not something a person retries
        by hand.

        **Maintenance mode freezes this the way it freezes the other two sign-ins.**
        The freeze is on starting a session, not on a credential, so an OAuth sign-in
        has to answer to it or the switch is bypassable by anybody holding a Google
        account. Refused before the exchange, so a frozen deployment makes no
        outbound call, spends nobody's authorization code, and counts no auth
        failure: nobody failed to authenticate, the gateway declined to try.
      operationId: callback_v1_auth_oauth__provider__callback_post
      parameters:
      - description: Which OAuth provider to sign in with.
        explode: false
        in: path
        name: provider
        required: true
        schema:
          description: Which OAuth provider to sign in with.
          pattern: ^(github|google)$
          title: Provider
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthCallbackRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSessionResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Callback
      tags:
      - auth
  /v1/auth/password:
    put:
      description: |-
        Set or change the password the caller signs in to the dashboard with.

        Always the caller's own identity. Supply ``email`` when it has no sign-in
        address yet, which is the state first boot leaves the operator in, and
        ``current_password`` when it already has a password and the request is
        authenticated by the session cookie. The master key in a header is what
        excuses ``current_password``, which is how a forgotten password is
        recovered; it does not excuse ``email``, because an identity with no address
        has nothing to sign in with whoever is asking. The operator setting a password
        for the first time retires master-key sign-in on this deployment.

        Every other session this identity holds ends, the caller's own excepted, so
        a cookie stolen before the change does not outlive it.
      operationId: set_dashboard_password_v1_auth_password_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetPasswordRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Set Dashboard Password
      tags:
      - auth
  /v1/auth/password/reset:
    post:
      description: "Mail a password-reset link, or do nothing: the response never\
        \ says which."
      operationId: request_reset_v1_auth_password_reset_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestPasswordResetRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestPasswordResetResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Request Reset
      tags:
      - auth
  /v1/auth/password/reset/confirm:
    post:
      description: "Complete a password reset. Single-use: the token stops working\
        \ after this."
      operationId: confirm_reset_v1_auth_password_reset_confirm_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Confirm Reset
      tags:
      - auth
  /v1/auth/resend-verification:
    post:
      description: "Mail a fresh verification link, or do nothing: the response never\
        \ says which."
      operationId: resend_verification_v1_auth_resend_verification_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResendVerificationRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResendVerificationResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Resend Verification
      tags:
      - auth
  /v1/auth/session:
    delete:
      description: |-
        Sign out: revoke the cookie's session server-side and expire the cookie.

        Deliberately unauthenticated and idempotent: it only ever revokes the
        session named by the caller's own cookie, and the dashboard calls it on the
        401-bounce path where no valid credential exists anymore. Unlike the read
        path in ``deps.py`` it applies no Sec-Fetch-Site check: ``SameSite=Strict``
        already keeps cross-site requests from carrying the cookie, and the worst a
        forged call could do is sign the operator out.
      operationId: delete_session_v1_auth_session_delete
      responses:
        "204":
          description: Successful Response
      summary: Delete Session
      tags:
      - auth
    post:
      description: |-
        Verify a sign-in credential and set the HttpOnly session cookie.

        The session is bound to the identity that authenticated, so every request it
        later authenticates resolves a user and that user's active organization
        rather than only "a credential was presented once". The response names both,
        so a client knows who it is signed in as without a second call.

        The rate-limit check deliberately runs only after a failed verification,
        not before it: a pre-verification gate can't know whether *this* attempt
        would have succeeded, so once an IP has used up its failure quota it
        would end up blocking that IP's legitimate owner too, not just further
        attackers. Running after verification also means the throttle bounds how
        many verdicts an IP gets, not how much work it can cause: a password attempt
        pays for a bcrypt verification (cost 12, on the order of 200ms of CPU, and
        one is burned against a stand-in hash even for an address nobody holds)
        before the limit is consulted, so a 429 costs the same as a 401. A gateway
        exposed to the internet should rate-limit this path at the proxy as well.

        The maintenance-mode check runs before either credential is verified, and
        refuses both. Before, because a frozen deployment should not spend a bcrypt
        verification per attempt and the refusal is not about the credential
        anyway; both, because the way back out is the master key against
        ``PATCH /v1/settings/maintenance-mode`` through the header, which never
        passes through this door. That is what keeps the way back out off the frozen
        path, and it is why no identity needs an exemption here; an operator who no
        longer holds the master key recovers by setting ``OTARI_MASTER_KEY`` and
        restarting, which is a restart rather than a click. It leaks nothing
        either: ``GET /v1/bootstrap`` already publishes the same flag
        unauthenticated, so the sign-in screen can render the right page.
      operationId: create_session_v1_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create Session
      tags:
      - auth
  /v1/auth/signup:
    post:
      description: |-
        Claim a roster identity, or do nothing: the response never says which.

        No session is minted. A newly claimed identity is hard-blocked from
        signing in until it verifies, so there is nothing yet to sign it into.
      operationId: signup_v1_auth_signup_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignupResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Signup
      tags:
      - auth
  /v1/auth/verify-email:
    post:
      description: "Confirm an address from its verification link, lifting the sign-in\
        \ gate."
      operationId: verify_email_route_v1_auth_verify_email_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyEmailRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyEmailResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Verify Email Route
      tags:
      - auth
  /v1/auth/webauthn/authenticate:
    post:
      description: |-
        Verify an assertion and set the HttpOnly session cookie.

        The session is bound to the identity whose passkey signed, exactly as a
        password sign-in binds one to the identity that authenticated, so every
        request it later authenticates resolves the same caller.

        A refusal is counted like the other sign-in failures
        (``record_auth_failure``) and answered as a 401 by the tenancy error
        handler. Unlike the password path there is no separate post-failure
        throttle: this route is throttled unconditionally on the way in, because
        unlike a password there is no legitimate caller here whose correct
        credential must never be blocked (a passkey ceremony is one round trip a
        browser drives, not something a person retries by hand).

        **Maintenance mode freezes this the way it freezes the password sign-in.**
        The freeze is on starting a session, not on a credential, so a passkey has
        to answer to it or the switch is bypassable by anybody holding one, which is
        the whole population it exists to hold off during a redeploy. Refused before
        the assertion is verified, so a frozen deployment does no crypto and counts
        no auth failure: nobody failed to authenticate, the gateway declined to try.
      operationId: authenticate_passkey_v1_auth_webauthn_authenticate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatePasskeyRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasskeySessionResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Authenticate Passkey
      tags:
      - auth
  /v1/auth/webauthn/authenticate/options:
    post:
      description: |-
        Start a passkey sign-in. Public, throttled, and names no credentials.

        The options carry no ``allowCredentials``, so this publishes nothing about
        who holds a passkey here; see ``webauthn_service.begin_authentication``.
      operationId: authentication_options_v1_auth_webauthn_authenticate_options_post
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyOptions"
          description: Successful Response
      summary: Authentication Options
      tags:
      - auth
  /v1/auth/webauthn/credentials:
    get:
      description: |-
        The caller's own passkeys. Never anybody else's, and never key material.

        Deliberately *not* behind ``require_passkey_support``, and not filtered to
        the current relying-party ID. A deployment that has changed or lost that ID
        still holds the rows registered under the old one, and refusing to list them
        would leave somebody looking at an empty page with no way to clean up and no
        hint as to why. Each row carries ``is_usable`` instead, so an orphan is
        visible, explained, and deletable.
      operationId: list_passkeys_v1_auth_webauthn_credentials_get
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCredentialsPublic"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Passkeys
      tags:
      - auth
  /v1/auth/webauthn/credentials/{credential_id}:
    delete:
      description: |-
        Remove one of the caller's passkeys.

        Removing the last one is allowed: an email and password is still this
        deployment's login, so this is not a lockout, and refusing would strand
        whoever lost the authenticator.
      operationId: delete_passkey_v1_auth_webauthn_credentials__credential_id__delete
      parameters:
      - explode: false
        in: path
        name: credential_id
        required: true
        schema:
          format: uuid
          title: Credential Id
          type: string
        style: simple
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Passkey
      tags:
      - auth
    patch:
      description: |-
        Relabel one of the caller's passkeys, which is all that is editable.

        Ungated like the list, and for the same reason: naming an orphan before
        deleting it is not something a lost relying-party ID should prevent.
      operationId: rename_passkey_v1_auth_webauthn_credentials__credential_id__patch
      parameters:
      - explode: false
        in: path
        name: credential_id
        required: true
        schema:
          format: uuid
          title: Credential Id
          type: string
        style: simple
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebAuthnCredentialUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCredentialPublic"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Rename Passkey
      tags:
      - auth
  /v1/auth/webauthn/register:
    post:
      description: Verify a registration ceremony and store the passkey it produced.
      operationId: register_passkey_v1_auth_webauthn_register_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterPasskeyRequest"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebAuthnCredentialPublic"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Register Passkey
      tags:
      - auth
  /v1/auth/webauthn/register/options:
    post:
      description: |-
        Start registering a passkey for the signed-in identity.

        A POST rather than a GET even though it reads like one: it issues a
        server-side challenge and writes it, so it is not safe to repeat, cache, or
        prefetch.
      operationId: registration_options_v1_auth_webauthn_register_options_post
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CeremonyOptions"
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Registration Options
      tags:
      - auth
  /v1/batches:
    get:
      description: |-
        List batches for a provider.

        Non-master keys only see batches they own in their own workspace (plus
        legacy batches without an ownership marker, or without a recorded
        workspace); the page is filtered after the provider call, so a page may
        contain fewer than ``limit`` items.
      operationId: list_batches_v1_batches_get
      parameters:
      - explode: true
        in: query
        name: provider
        required: true
        schema:
          title: Provider
          type: string
        style: form
      - explode: true
        in: query
        name: after
        required: false
        schema:
          description: "Filter to a single event type or metric name (e.g. 'tool_result',\
            \ 'claude_code.commit.count')"
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          description: "Filter to a single failure status code (e.g. 429 for provider\
            \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
            \ one, so this filter also restricts to status='error' unless 'status'\
            \ is given explicitly"
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Batches
      tags:
      - batches
    post:
      description: |-
        Create a batch of LLM requests for asynchronous processing.

        Authentication modes:
        - Master key + user field: Use specified user (must exist)
        - API key + user field: Use specified user (must exist)
        - API key without user field: Use the shared "default" user
      operationId: create_batch_v1_batches_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Batch
      tags:
      - batches
  /v1/batches/{batch_id}:
    get:
      description: Retrieve the status of a batch.
      operationId: retrieve_batch_v1_batches__batch_id__get
      parameters:
      - explode: false
        in: path
