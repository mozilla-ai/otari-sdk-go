            application/json:
              schema:
                $ref: "#/components/schemas/CreateKeyResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Key
      tags:
      - keys
