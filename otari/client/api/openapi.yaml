components:
  schemas:
    AliasRequest:
      description: Request to create or update an alias.
      example:
        user_id: user_id
        name: name
        target: target
      properties:
        name:
          description: "Display name callers use as the model, e.g. 'fast-model'."
          title: Name
          type: string
        target:
          description: "Selector the alias resolves to, as 'provider:model' or 'instance:model'."
          title: Target
          type: string
        user_id:
          description: User this alias belongs to. Omit for a global alias every caller
            sees. A user-scoped alias resolves only for that user and shadows a global
            one of the same name.
          nullable: true
          type: string
      required:
      - name
      - target
      title: AliasRequest
    AliasResponse:
      description: A model alias and where it is defined.
      example:
        updated_at: updated_at
        user_id: user_id
        name: name
        created_at: created_at
        source: source
        target: target
      properties:
        created_at:
          nullable: true
          type: string
        name:
          title: Name
          type: string
        source:
          title: Source
          type: string
        target:
          title: Target
          type: string
        updated_at:
          nullable: true
          type: string
        user_id:
          nullable: true
          type: string
      required:
      - name
      - source
      - target
      title: AliasResponse
    AudioSpeechRequest:
      description: |-
        OpenAI-compatible audio speech (TTS) request.

        The speech fields are derived from any-llm's ``AudioSpeechParams`` (see
        ``_schema_derive``) so the schema cannot silently drop a param any-llm
        forwards. ``user`` is gateway-only (billing / auth scoping); it is not an
        any-llm param and is stripped before the request is forwarded.
      example:
        voice: voice
        input: input
        instructions: instructions
        response_format: response_format
        model: model
        user: user
        speed: 0.8008281904610115
      properties:
        input:
          title: Input
          type: string
        instructions:
          nullable: true
          type: string
        model:
          title: Model
          type: string
        response_format:
          nullable: true
          type: string
        speed:
          nullable: true
          type: number
        user:
          nullable: true
          type: string
        voice:
          title: Voice
          type: string
      required:
      - input
      - model
      - voice
      title: AudioSpeechRequest
    BatchRequestItem:
      example:
        custom_id: custom_id
        body:
          key: ""
      properties:
        body:
          additionalProperties: true
          title: Body
          type: object
        custom_id:
          title: Custom Id
          type: string
      required:
      - body
      - custom_id
      title: BatchRequestItem
    Body_create_file_v1_files_post:
      properties:
        file:
          title: File
          type: string
        purpose:
          default: user_data
          title: Purpose
          type: string
        user:
          nullable: true
          type: string
      required:
      - file
      title: Body_create_file_v1_files_post
    Body_create_transcription_v1_audio_transcriptions_post:
      properties:
        file:
          title: File
          type: string
        language:
          nullable: true
          type: string
        model:
          title: Model
          type: string
        prompt:
          nullable: true
          type: string
        response_format:
          nullable: true
          type: string
        temperature:
          nullable: true
          type: number
        user:
          nullable: true
          type: string
      required:
      - file
      - model
      title: Body_create_transcription_v1_audio_transcriptions_post
    BudgetResetLogResponse:
      description: Response model for one budget reset event (per user).
      example:
        user_id: user_id
        budget_id: budget_id
        id: 0
        reset_at: reset_at
        next_reset_at: next_reset_at
        previous_spend: 6.027456183070403
      properties:
        budget_id:
          title: Budget Id
          type: string
        id:
          title: Id
          type: integer
        next_reset_at:
          nullable: true
          type: string
        previous_spend:
          title: Previous Spend
          type: number
        reset_at:
          title: Reset At
          type: string
        user_id:
          nullable: true
          type: string
      required:
      - budget_id
      - id
      - next_reset_at
      - previous_spend
      - reset_at
      - user_id
      title: BudgetResetLogResponse
    BudgetResponse:
      description: |-
        Response model for budget information.

        ``max_budget`` is the per-user spending limit, and multiple users can share
        one budget, so the usage rollup is an aggregate over the users assigned to
        this budget: how many there are and their combined ``spend`` / ``reserved``.
        Assigning users to a budget is done through the users API (dashboard support
        lands with user management), so a fresh gateway reports zeros here.
      example:
        total_spend: 5.962133916683182
        updated_at: updated_at
        user_count: 5
        budget_id: budget_id
        total_reserved: 1.4658129805029452
        budget_duration_sec: 0
        name: name
        created_at: created_at
        max_budget: 6.027456183070403
      properties:
        budget_duration_sec:
          nullable: true
          type: integer
        budget_id:
          title: Budget Id
          type: string
        created_at:
          title: Created At
          type: string
        max_budget:
          nullable: true
          type: number
        name:
          nullable: true
          type: string
        total_reserved:
          default: 0.0
          title: Total Reserved
          type: number
        total_spend:
          default: 0.0
          title: Total Spend
          type: number
        updated_at:
          title: Updated At
          type: string
        user_count:
          default: 0
          title: User Count
          type: integer
      required:
      - budget_duration_sec
      - budget_id
      - created_at
      - max_budget
      - name
      - updated_at
      title: BudgetResponse
    CandidateResponse:
      description: One candidate in a compiled plan.
      example:
        instance: instance
        selection_reason: selection_reason
        dispatch_model: dispatch_model
        model: model
        position: 0
      properties:
        dispatch_model:
          title: Dispatch Model
          type: string
        instance:
          title: Instance
          type: string
        model:
          title: Model
          type: string
        position:
          title: Position
          type: integer
        selection_reason:
          title: Selection Reason
          type: string
      required:
      - dispatch_model
      - instance
      - model
      - position
      - selection_reason
      title: CandidateResponse
    ChatCompletionRequest:
      description: |-
        OpenAI-compatible chat completion request.

        The completion-param fields are derived from any-llm's ``CompletionParams``
        (see ``_schema_derive``) so the schema cannot silently drop a param any-llm
        forwards. Fields below either tighten a derived field (``messages``,
        ``response_format``) or add gateway-internal behavior (``mcp_servers``,
        ``mcp_server_ids``, ``guardrails``, ``tools_header``, ``max_tool_iterations``)
        that is stripped before the request is forwarded upstream.
      example:
