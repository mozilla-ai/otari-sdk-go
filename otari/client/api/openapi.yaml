      title: CreateUserRequest
    DeploymentAdminAccessPublic:
      description: |-
        Whether the caller may reach the deployment administration surface.

        The one endpoint in that surface that answers 200 for everybody, and
        deliberately: the rest refuse with 404 so they do not confirm they exist,
        which leaves the dashboard nothing to gate its navigation on but a failed
        request. This says the same thing a caller could learn by trying, without
        the try.
      example:
        granted: true
      properties:
        granted:
          title: Granted
          type: boolean
      required:
      - granted
      title: DeploymentAdminAccessPublic
    DeploymentBootstrap:
      description: What the dashboard shell needs before it can render anything.
      example:
        management_url: management_url
        sign_in_methods:
        - master_key
        - master_key
        maintenance_mode: true
        oauth_providers:
        - oauth_providers
        - oauth_providers
        deployment_type: standalone
        docs_url: docs_url
        surfaces:
        - surfaces
        - surfaces
        terms_url: terms_url
        privacy_url: privacy_url
        data_plane_url: data_plane_url
        mail_ready: true
        session_type: local_operator
        passkeys_ready: true
      properties:
        data_plane_url:
          description: "Where this deployment's inference traffic belongs, when it\
            \ is not served here. The mirror of management_url: that one says where\
            \ management lives when this deployment is not the control plane, this\
            \ one says where the data plane is when this deployment is not it. Set\
            \ only by a hosted control plane, which serves the dashboard but not inference\
            \ (otari#822); null for standalone and hybrid, both of which serve inference\
            \ at the address that reached this page. Not a human link target like\
            \ management_url: it is the gateway's bare address, which the dashboard\
            \ suffixes with /v1 to build its request snippets. So it must carry no\
            \ /v1 path segment anywhere (a value ending in /v1, or a whole endpoint\
            \ like /v1/chat/completions, renders that path twice) and no credential,\
            \ since this response is unauthenticated. This gateway refuses both at\
            \ startup; any deployment serving this contract should publish the same\
            \ shape. Null on a hosted deployment means unconfigured, and the dashboard\
            \ then shows no snippet rather than one naming this host."
          nullable: true
          type: string
        deployment_type:
          description: "Which deployment serves this URL. 'standalone' owns its own\
            \ data and serves one tenant; 'hosted' owns its own data and serves many\
            \ (otari.ai, or any deployment run as a control plane), which is why its\
            \ management surfaces are the per-organization ones; 'hybrid' is a gateway\
            \ attached to otari.ai, which is data-plane only and holds no management\
            \ surface of its own."
          enum:
          - standalone
          - hosted
          - hybrid
          title: Deployment Type
          type: string
        docs_url:
          description: "Where this deployment's documentation lives, when it is not\
            \ the operator guide bundled with the gateway. Set, the dashboard's Documentation\
            \ links open it in a new tab; null, they go to the bundled guide at /#/docs,\
            \ which stays served either way. A link target an operator configured,\
            \ validated at startup as an absolute http(s) URL carrying no credential,\
            \ since this response is unauthenticated."
          nullable: true
          type: string
        mail_ready:
          description: "Whether this deployment can deliver a message carrying a link\
            \ back to itself (an invitation's accept link, and the verification and\
            \ reset links to come), not merely whether a transport is configured:\
            \ it also needs to know its own public URL to put in one. Lets the dashboard\
            \ disable or hide a mail-dependent affordance instead of offering one\
            \ that would fail at send time. Every message this control plane sends\
            \ carries such a link, which is why this is one flag and not one per feature.\
            \ False for a hybrid gateway, whose control plane is otari.ai and which\
            \ sends no mail of its own."
          title: Mail Ready
          type: boolean
        maintenance_mode:
          description: "Whether this deployment is refusing new dashboard sign-ins\
            \ while an operator redeploys it. The sign-in screen says so rather than\
            \ presenting a form whose only outcome is a 503. Sessions already issued\
            \ keep working, and the management API and the data plane are unaffected.\
            \ False for a hybrid gateway, which issues no session."
          title: Maintenance Mode
          type: boolean
        management_url:
          description: Where the authoritative control plane lives when it is not
            this deployment. Set for a hybrid gateway so its landing page can link
            to otari.ai; null otherwise.
          nullable: true
          type: string
        oauth_providers:
          description: "OAuth providers this deployment can sign somebody in with,\
            \ sorted, one entry per provider with a client ID, a client secret and\
            \ a public_base_url to build a redirect URI from. The sign-in screen renders\
            \ a button per entry and none at all when the list is empty, so a provider\
            \ nobody configured is absent rather than offered and then refused. Additive\
            \ to sign_in_methods rather than part of it: an OAuth sign-in coexists\
            \ with whichever typed credential is current, the way a passkey does.\
            \ Empty for a hybrid gateway, which issues no session."
          items:
            type: string
          title: Oauth Providers
          type: array
        passkeys_ready:
          description: "Whether this deployment can run a passkey ceremony at all:\
            \ it has a relying-party ID (webauthn_rp_id, or derived from public_base_url)\
            \ and an origin to serve one from. Distinct from 'passkey' in sign_in_methods,\
            \ which is narrower and answers whether a registered passkey could sign\
            \ somebody in *right now*: an operator with none yet needs this one, or\
            \ the page that registers the first would be hidden from them. False for\
            \ a hybrid gateway, which issues no session of its own."
          title: Passkeys Ready
          type: boolean
        privacy_url:
          description: "Where this deployment's privacy notice lives. Set, the account\
            \ menu's Data & Privacy row links to it; null, no address is configured\
            \ and that row stays disabled, carrying the standing note that there is\
            \ nothing to configure there yet. A link target an operator configured,\
            \ validated at startup as an absolute http(s) URL carrying no credential,\
            \ since this response is unauthenticated."
          nullable: true
          type: string
        session_type:
          description: "The kind of session this deployment issues, not whether the\
            \ caller holds one. 'local_operator' is the standalone operator sign-in\
            \ (see sign_in_methods for which credential it currently accepts), 'hosted_user'\
            \ an otari.ai account, and 'none' a deployment that issues no management\
            \ session at all."
          enum:
          - local_operator
          - hosted_user
          - none
          title: Session Type
          type: string
        sign_in_methods:
          description: "How POST /v1/auth/session may be authenticated right now,\
            \ sorted. 'master_key' is the first-boot credential and is offered until\
            \ the operator identity has a password, which is what claiming the deployment\
            \ means; 'password' replaces it from then on, and the master key stays\
            \ the credential for the management API. 'passkey' appears alongside either\
            \ one when this deployment is configured for WebAuthn and holds at least\
            \ one passkey that its current relying-party ID can assert. Empty for\
            \ a hybrid gateway, which issues no session. The login page renders from\
            \ this rather than trying a credential to find out."
          items:
            enum:
            - master_key
            - password
            - passkey
            type: string
          title: Sign In Methods
          type: array
        surfaces:
          description: "Management API groups this deployment serves, sorted, which\
            \ is what its dashboard pages gate on. Named surfaces, not capabilities:\
            \ capability is otari.ai's word for the entitlement (licensing) axis,\
            \ and this is the deployment (topology) axis. Empty for a hybrid gateway."
          items:
            type: string
          title: Surfaces
          type: array
        terms_url:
          description: "Where this deployment's terms of service live. Set, the account\
            \ menu carries a Terms of service row pointing at them; null, no address\
            \ is configured and the menu carries no such row. A link target an operator\
            \ configured, validated at startup as an absolute http(s) URL carrying\
            \ no credential, since this response is unauthenticated."
          nullable: true
          type: string
      required:
      - data_plane_url
      - deployment_type
      - docs_url
      - mail_ready
      - maintenance_mode
      - management_url
      - oauth_providers
      - passkeys_ready
      - privacy_url
      - session_type
      - sign_in_methods
      - surfaces
      - terms_url
      title: DeploymentBootstrap
    DeploymentUserOrganizationPublic:
      description: "One organization an identity belongs to, as the operator surface\
        \ lists it."
      example:
        role: role
        organization_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        name: name
        slug: slug
        status: status
      properties:
        name:
          title: Name
          type: string
        organization_id:
          format: uuid
          title: Organization Id
          type: string
        role:
          title: Role
          type: string
        slug:
          title: Slug
          type: string
        status:
          title: Status
          type: string
      required:
      - name
      - organization_id
      - role
      - slug
      - status
      title: DeploymentUserOrganizationPublic
    DeploymentUserPublic:
      description: |-
        An identity on this deployment, whatever organization it belongs to.

        Not ``ActiveOrganizationMemberPublic``: that shape is a *membership* joined
        to an identity, scoped to one organization and hiding the suspended rows.
        This one is the identity itself, and its ``organizations`` list carries every
        membership at whatever status, because an account whose only membership is
        suspended is precisely what an operator comes here to find.

        ``is_bootstrap_operator`` and ``is_self`` are the two rows an operator may
        not deactivate or demote, and they travel on the row so the page can disable
        those controls rather than offering ones the server refuses. Neither is an
        authorization: the server refuses either way. ``is_self`` is answered here
        because nothing else the dashboard fetches names the caller's identity, so
        without it the page could not tell which row is the reader's own.
      example:
        is_bootstrap_operator: true
        full_name: full_name
        is_active: true
        is_superuser: true
        last_sign_in_at: 2000-01-23T04:56:07.000+00:00
        organizations:
        - role: role
          organization_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          slug: slug
          status: status
        - role: role
          organization_id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
          name: name
          slug: slug
          status: status
        created_at: 2000-01-23T04:56:07.000+00:00
        id: 046b6c7f-0b8a-43b9-b35d-6489e6daee91
        is_self: true
        email: email
      properties:
        created_at:
          format: date-time
          title: Created At
          type: string
        email:
          nullable: true
          type: string
        full_name:
          nullable: true
          type: string
        id:
          format: uuid
          title: Id
          type: string
        is_active:
          title: Is Active
          type: boolean
        is_bootstrap_operator:
          title: Is Bootstrap Operator
          type: boolean
        is_self:
          title: Is Self
          type: boolean
        is_superuser:
          title: Is Superuser
          type: boolean
        last_sign_in_at:
          format: date-time
          nullable: true
          type: string
        organizations:
          items:
            $ref: "#/components/schemas/DeploymentUserOrganizationPublic"
          title: Organizations
          type: array
      required:
      - created_at
      - email
      - full_name
      - id
      - is_active
      - is_bootstrap_operator
      - is_self
      - is_superuser
      - last_sign_in_at
      - organizations
      title: DeploymentUserPublic
    DeploymentUserUpdateRequest:
      description: |-
        The two flags the operator surface may flip, each optional.

        Omitting a field leaves it alone, so deactivating an account and changing
        what it may administer stay separate decisions even though one endpoint
        carries both. A body that sets neither is refused rather than treated as a
        no-op: it is a request that meant something and lost it.
      example:
        is_active: true
        is_superuser: true
      properties:
        is_active:
          nullable: true
          type: boolean
        is_superuser:
          nullable: true
          type: boolean
