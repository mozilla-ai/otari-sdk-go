    UsageSeriesPoint:
      description: |-
        One time bucket. ``bucket_start`` is canonical ISO-8601 UTC (``...Z``),
        identical across SQLite and PostgreSQL for the same underlying instant.

        ``tokens`` stays the raw provider-reported total (the field predates the
        composition split and external consumers may read it). The billed
        composition fields are normalized via billing meters (see ``_billed_expr``):
        ``input_tokens`` includes both cache buckets, so a chart derives fresh input
        as ``max(0, input_tokens - cache_read_tokens - cache_write_tokens)`` and the
        billed total as ``fresh + cache_read + cache_write + output``.
      example:
        cache_write_tokens: 9
        cost: 3.616076749251911
        bucket_start: bucket_start
        output_tokens: 7
        tokens: 1
        cache_read_tokens: 7
        requests: 1
        input_tokens: 4
        errors: 2
      properties:
        bucket_start:
          title: Bucket Start
          type: string
        cache_read_tokens:
          default: 0
          title: Cache Read Tokens
          type: integer
        cache_write_tokens:
          default: 0
          title: Cache Write Tokens
          type: integer
        cost:
          title: Cost
          type: number
        errors:
          default: 0
          title: Errors
          type: integer
        input_tokens:
          default: 0
          title: Input Tokens
          type: integer
        output_tokens:
          default: 0
          title: Output Tokens
          type: integer
        requests:
          title: Requests
          type: integer
        tokens:
          title: Tokens
          type: integer
      required:
      - bucket_start
      - cost
      - requests
      - tokens
      title: UsageSeriesPoint
