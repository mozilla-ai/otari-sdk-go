          nullable: true
          type: string
        is_dynamic:
          default: false
          title: Is Dynamic
          type: boolean
        name:
          title: Name
          type: string
        source:
          title: Source
          type: string
        spec:
          additionalProperties: true
          title: Spec
          type: object
        updated_at:
          nullable: true
          type: string
        user_id:
          nullable: true
          type: string
        workspace_id:
          format: uuid
          nullable: true
          type: string
      required:
