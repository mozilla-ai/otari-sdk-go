openapi: 3.1.0
info:
  description: "Otari, an OpenAI-compatible LLM gateway with API key management"
  title: otari
  version: 0.0.0-dev
servers:
- url: /
paths:
  /health:
    get:
      description: |-
        General health check endpoint.

        Returns basic health status. For infrastructure monitoring,
        use /health/readiness or /health/liveness instead.
      operationId: health_check_health_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                title: Response Health Check Health Get
          description: Successful Response
      summary: Health Check
      tags:
      - health
  /health/liveness:
    get:
      description: |-
        Liveness probe endpoint.

        Simple check to verify the process is alive and responding.
        Used by Kubernetes/container orchestrators for liveness probes.

        Returns:
            Plain text "I'm alive!" message
      operationId: health_liveness_health_liveness_get
      responses:
        "200":
          content:
            application/json:
              schema:
                title: Response Health Liveness Health Liveness Get
                type: string
          description: Successful Response
      summary: Health Liveness
      tags:
      - health
  /health/readiness:
    get:
      description: |-
        Readiness probe endpoint.

        Checks if the gateway is ready to serve requests by validating:
        - Database connectivity
        - Service availability

        Used by Kubernetes/container orchestrators for readiness probes.
        Returns HTTP 503 if any dependency is unavailable.

        Returns:
            dict: Status object with health details

        Raises:
            HTTPException: 503 if service is not ready
      operationId: health_readiness_health_readiness_get
      responses:
        "200":
          content:
            application/json:
              schema:
                additionalProperties: {}
                title: Response Health Readiness Health Readiness Get
          description: Successful Response
      summary: Health Readiness
      tags:
      - health
  /v1/aliases:
    get:
      description: |-
        List every alias in force, from config.yml and from storage.

        Every scope at once, global and user-scoped alike: this is the master-key
        management view, not what any one caller resolves.
      operationId: list_aliases_v1_aliases_get
      responses:
        "200":
          content:
            application/json:
              schema:
                items:
                  $ref: "#/components/schemas/AliasResponse"
                title: Response List Aliases V1 Aliases Get
                type: array
          description: Successful Response
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Aliases
      tags:
      - aliases
    post:
      description: "Create or update a stored alias, global or scoped to one user."
      operationId: set_alias_v1_aliases_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AliasRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AliasResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Set Alias
      tags:
      - aliases
  /v1/aliases/{name}:
    delete:
      description: |-
        Delete a stored alias in one scope.

        Scoped by ``user_id`` for the same reason the upsert is: deleting the global
        alias must not take a user's override with it, and deleting an override must
        leave the global one serving everyone else.
      operationId: delete_alias_v1_aliases__name__delete
      parameters:
      - explode: false
        in: path
        name: name
        required: true
        schema:
          title: Name
          type: string
        style: simple
      - description: Delete the alias scoped to this user. Omit to delete the global
          alias of that name.
        explode: true
        in: query
        name: user_id
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      responses:
        "204":
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Delete Alias
      tags:
      - aliases
  /v1/audio/speech:
    post:
      description: |-
        OpenAI-compatible audio speech (TTS) endpoint.

        Authentication modes:
        - Master key + user field: Use specified user (must exist)
        - API key + user field: Use specified user (must exist)
        - API key without user field: Use the shared "default" user
      operationId: create_speech_v1_audio_speech_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioSpeechRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
            audio/L16:
              schema:
                format: binary
                type: string
            audio/aac:
              schema:
                format: binary
                type: string
            audio/flac:
              schema:
                format: binary
                type: string
            audio/mpeg:
              schema:
                format: binary
                type: string
            audio/opus:
              schema:
                format: binary
                type: string
            audio/wav:
              schema:
                format: binary
                type: string
          description: Audio bytes in the requested format
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Speech
      tags:
      - audio
  /v1/audio/transcriptions:
    post:
      description: |-
        OpenAI-compatible audio transcription endpoint.

        Authentication modes:
        - Master key + user field: Use specified user (must exist)
        - API key + user field: Use specified user (must exist)
        - API key without user field: Use the shared "default" user
      operationId: create_transcription_v1_audio_transcriptions_post
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/Body_create_transcription_v1_audio_transcriptions_post"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Transcription
      tags:
      - audio
  /v1/auth/session:
    delete:
      description: |-
        Sign out: revoke the cookie's session server-side and expire the cookie.

        Deliberately unauthenticated and idempotent: it only ever revokes the
        session named by the caller's own cookie, and the dashboard calls it on the
        401-bounce path where no valid credential exists anymore. Unlike the read
        path in ``deps.py`` it applies no Sec-Fetch-Site check: ``SameSite=Strict``
        already keeps cross-site requests from carrying the cookie, and the worst a
        forged call could do is sign the operator out.
      operationId: delete_session_v1_auth_session_delete
      responses:
        "204":
          description: Successful Response
      summary: Delete Session
      tags:
      - auth
    post:
      description: |-
        Verify the master key and set the HttpOnly session cookie.

        The rate-limit check deliberately runs only after a failed verification,
        not before it: a pre-verification gate can't know whether *this* attempt
        would have succeeded, so once an IP has used up its failure quota it
        would end up blocking that IP's legitimate owner too, not just further
        attackers. The issue this implements explicitly rules that out. The
        DB/hash lookup this exposes to repeated attempts only runs when no fixed
        master_key is configured (the auto-generated bootstrap-key path); with a
        configured master_key, verification is a constant-time string compare,
        not a DB round trip.
      operationId: create_session_v1_auth_session_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionResponse"
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      summary: Create Session
      tags:
      - auth
  /v1/batches:
    get:
      description: |-
        List batches for a provider.

        Non-master keys only see batches they own (plus legacy batches without an
        ownership marker); the page is filtered after the provider call, so a page
        may contain fewer than ``limit`` items.
      operationId: list_batches_v1_batches_get
      parameters:
      - explode: true
        in: query
        name: provider
        required: true
        schema:
          title: Provider
          type: string
        style: form
      - explode: true
        in: query
        name: after
        required: false
        schema:
          description: Delete the alias scoped to this user. Omit to delete the global
            alias of that name.
          nullable: true
          type: string
        style: form
      - explode: true
        in: query
        name: limit
        required: false
        schema:
          description: "Filter to a single failure status code (e.g. 429 for provider\
            \ rate limits, 402 for missing-pricing rejections). Only error rows carry\
            \ one, so this filter also restricts to status='error' unless 'status'\
            \ is given explicitly"
          nullable: true
          type: integer
        style: form
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: List Batches
      tags:
      - batches
    post:
      description: |-
        Create a batch of LLM requests for asynchronous processing.

        Authentication modes:
        - Master key + user field: Use specified user (must exist)
        - API key + user field: Use specified user (must exist)
        - API key without user field: Use the shared "default" user
      operationId: create_batch_v1_batches_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBatchRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema: {}
          description: Successful Response
        "422":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
          description: Validation Error
      security:
      - ApiKeyAuth: []
      - XApiKeyAuth: []
      summary: Create Batch
      tags:
      - batches
  /v1/batches/{batch_id}:
    get:
      description: Retrieve the status of a batch.
      operationId: retrieve_batch_v1_batches__batch_id__get
      parameters:
      - explode: false
