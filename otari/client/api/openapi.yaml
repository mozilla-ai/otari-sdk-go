    AgentTelemetryMeasures:
      description: |-
        Cost and quality per unit of work. Each is null when its denominator is zero.

        ``edit_acceptance_rate`` and ``tool_acceptance_rate`` are the same quantity
        today, both derived from the ``tool_decision`` event: the agent's own
        ``code_edit_tool.decision`` metric is deliberately never stored, since
        ``tool_decision`` already carries that accept/reject signal. Both names are
        reported so a caller reading either vocabulary gets the right number.
      example:
        cost_per_line: 3.616076749251911
        error_rate: 7.386281948385884
        tool_acceptance_rate: 1.0246457001441578
        cost_per_pull_request: 2.027123023002322
        turns_per_session: 1.4894159098541704
        spend_per_active_hour: 1.2315135367772556
        edit_acceptance_rate: 4.145608029883936
        cost_per_commit: 9.301444243932576
      properties:
        cost_per_commit:
          nullable: true
          type: number
        cost_per_line:
          nullable: true
          type: number
        cost_per_pull_request:
          nullable: true
          type: number
        edit_acceptance_rate:
          nullable: true
          type: number
        error_rate:
          nullable: true
          type: number
        spend_per_active_hour:
          nullable: true
          type: number
        tool_acceptance_rate:
          nullable: true
          type: number
        turns_per_session:
          nullable: true
          type: number
      title: AgentTelemetryMeasures
    AgentTelemetryOutcomes:
      description: |-
        How much work the agent produced inside the window.

        Each value is the read-time increment for its metric: a delta series is
        summed, a cumulative one is diffed per series generation, so a counter that
        is re-reported in full on every export is never counted twice.
        ``lines_of_code`` sums the added and removed series, which are stored
        separately. ``active_time`` is in seconds, as the agent reports it.
      example:
        active_time: 6.84685269835264
        pull_requests: 4.965218492984954
        commits: 7.457744773683766
        lines_of_code: 1.1730742509559433
      properties:
        active_time:
          default: 0.0
          title: Active Time
          type: number
        commits:
          default: 0.0
          title: Commits
          type: number
        lines_of_code:
          default: 0.0
          title: Lines Of Code
          type: number
        pull_requests:
          default: 0.0
          title: Pull Requests
          type: number
      title: AgentTelemetryOutcomes
    AgentTelemetrySeriesPoint:
      description: |-
        One UTC time bucket of outcomes, behavior, and the spend beside them.

        A cumulative series' increment is attributed to the bucket of the later point
        of each consecutive pair, so a bucket reports the growth observed inside it.
      example:
        active_time: 5.025004791520295
        pull_requests: 9.018348186070783
        cost: 6.683562403749608
        api_errors: 9
        bucket_start: bucket_start
        commits: 9.369310271410669
        tool_calls: 6
        lines_of_code: 8.762042012749001
        turns: 3
      properties:
        active_time:
          default: 0.0
          title: Active Time
          type: number
        api_errors:
          default: 0
          title: Api Errors
          type: integer
        bucket_start:
          title: Bucket Start
          type: string
        commits:
          default: 0.0
          title: Commits
          type: number
        cost:
          default: 0.0
          title: Cost
          type: number
        lines_of_code:
          default: 0.0
          title: Lines Of Code
          type: number
        pull_requests:
          default: 0.0
          title: Pull Requests
          type: number
        tool_calls:
          default: 0
          title: Tool Calls
          type: integer
        turns:
          default: 0
          title: Turns
          type: integer
      required:
      - bucket_start
      title: AgentTelemetrySeriesPoint
    AgentTelemetrySummary:
      description: "Agent outcomes and behavior for the window, joined against recorded\
        \ spend."
      example:
        bucket: hour
        end_date: end_date
        measures:
          cost_per_line: 3.616076749251911
          error_rate: 7.386281948385884
          tool_acceptance_rate: 1.0246457001441578
          cost_per_pull_request: 2.027123023002322
          turns_per_session: 1.4894159098541704
          spend_per_active_hour: 1.2315135367772556
          edit_acceptance_rate: 4.145608029883936
          cost_per_commit: 9.301444243932576
        outcomes:
          active_time: 6.84685269835264
          pull_requests: 4.965218492984954
          commits: 7.457744773683766
          lines_of_code: 1.1730742509559433
        series:
        - active_time: 5.025004791520295
          pull_requests: 9.018348186070783
          cost: 6.683562403749608
          api_errors: 9
          bucket_start: bucket_start
          commits: 9.369310271410669
          tool_calls: 6
          lines_of_code: 8.762042012749001
          turns: 3
        - active_time: 5.025004791520295
          pull_requests: 9.018348186070783
          cost: 6.683562403749608
          api_errors: 9
          bucket_start: bucket_start
          commits: 9.369310271410669
          tool_calls: 6
          lines_of_code: 8.762042012749001
          turns: 3
        usage:
          cost: 6.965117697638846
          requests: 1
        behavior:
          sessions: 1
          api_errors: 0
          tool_accepts: 5
          tool_calls: 5
          by_tool:
          - calls: 6
            tool: tool
          - calls: 6
            tool: tool
          tool_rejects: 2
          turns: 7
        start_date: start_date
      properties:
        behavior:
          $ref: "#/components/schemas/AgentTelemetryBehavior"
        bucket:
          enum:
          - hour
          - day
          title: Bucket
          type: string
        end_date:
          title: End Date
          type: string
        measures:
          $ref: "#/components/schemas/AgentTelemetryMeasures"
        outcomes:
          $ref: "#/components/schemas/AgentTelemetryOutcomes"
        series:
          items:
            $ref: "#/components/schemas/AgentTelemetrySeriesPoint"
          title: Series
          type: array
        start_date:
          title: Start Date
          type: string
        usage:
          $ref: "#/components/schemas/AgentTelemetryUsage"
      required:
      - behavior
      - bucket
      - end_date
      - measures
      - outcomes
      - series
      - start_date
      - usage
      title: AgentTelemetrySummary
    AgentTelemetryToolRow:
