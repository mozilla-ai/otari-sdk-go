        api_key:
          description: Provider API key. Stored encrypted; never returned.
          nullable: true
          type: string
        name:
          description: "Name callers pass as 'search_tool_name' or in /v1/search/{tool}."
          minLength: 1
          title: Name
          type: string
        options:
          additionalProperties: true
          description: "Provider-native request fields used as defaults (e.g. exa's\
            \ 'type', searxng's 'engines')."
          nullable: true
          type: object
        provider:
          description: "Search provider, one of: exa, searxng."
          title: Provider
          type: string
        timeout:
          description: Per-request timeout in seconds.
          exclusiveMinimum: true
