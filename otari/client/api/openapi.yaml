    UsageErrorCodeRow:
      description: |-
        One error-taxonomy row: the failures in the window sharing a status code.

        ``status_code`` is None for failures recorded without one (rows written
        before the column existed, and failures no HTTP status describes, e.g. a
        stream that finished without usage data under the ``fail`` policy).
        ``error_class`` is the coarse display bucket derived from the code, so a UI
        can group "provider fault" against "my own misconfiguration" without
        re-deriving a status ladder; the raw code stays alongside it for precision.
      example:
        error_class: pricing
        status_code: 2
        requests: 5
      properties:
        error_class:
          enum:
          - pricing
          - rate_limit
          - auth
          - provider_error
          - client_error
          - unknown
          title: Error Class
          type: string
        requests:
          title: Requests
          type: integer
        status_code:
          nullable: true
          type: integer
      required:
      - error_class
      - requests
      - status_code
      title: UsageErrorCodeRow
    UsageGroupRow:
      description: |-
        One breakdown row (a model, a user, an API key, a session, ...).

        ``key`` is None both for the synthesized fold row (``is_other=True``) and for a
        real group whose column was NULL (e.g. usage from a since-deleted user, with
        ``is_other=False``). ``is_other`` disambiguates the two so the UI does not
        mislabel deleted-user usage as the fold.
      example:
        cost: 0.8008281904610115
        tokens: 1
        label: label
        requests: 6
        is_other: false
        key: key
      properties:
        cost:
          title: Cost
          type: number
        is_other:
          default: false
          title: Is Other
          type: boolean
        key:
          nullable: true
          type: string
        label:
          nullable: true
          type: string
        requests:
          title: Requests
          type: integer
        tokens:
          title: Tokens
          type: integer
      required:
      - cost
      - key
      - requests
      - tokens
      title: UsageGroupRow
    UsageGroupedSeries:
      description: |-
        A per-group time series for the dashboard's stacked charts.

        ``groups`` ranks the window's top groups by spend (plus the reconciling
        ``other`` fold), in the order a chart should stack and color them; ``points``
        is sparse (only populated cells), keyed by canonical UTC ``bucket_start``.
      example:
        bucket: hour
        end_date: end_date
        group_by: model
        groups:
        - cost: 0.8008281904610115
          tokens: 1
          label: label
          requests: 6
          is_other: false
          key: key
        - cost: 0.8008281904610115
          tokens: 1
          label: label
          requests: 6
          is_other: false
          key: key
        points:
        - cost: 5.962133916683182
          bucket_start: bucket_start
          tokens: 2
          requests: 5
          is_other: false
          key: key
        - cost: 5.962133916683182
          bucket_start: bucket_start
          tokens: 2
          requests: 5
          is_other: false
          key: key
        start_date: start_date
      properties:
        bucket:
          enum:
          - hour
          - day
          title: Bucket
          type: string
        end_date:
          title: End Date
          type: string
        group_by:
          enum:
          - model
          - user_id
          - api_key_id
          - source
          title: Group By
          type: string
        groups:
          items:
            $ref: "#/components/schemas/UsageGroupRow"
          title: Groups
          type: array
        points:
          items:
            $ref: "#/components/schemas/UsageGroupedSeriesPoint"
          title: Points
          type: array
        start_date:
          title: Start Date
          type: string
